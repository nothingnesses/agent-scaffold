receipt = "Q-52"
ask = """a deterministic, statistical-evidence-backed way to determine whether code is EARNING ITS KEEP (useful and worth keeping) vs accrued cruft/maintenance burden, run periodically (manually or in the workflow, e.g. at the acceptance/UAT step), likely MULTIPLE methods working together: the human raised (2026-07-19) that AI-accelerated development accrues code and maintenance burden faster, making keep-or-cut discipline the bottleneck, and asked for the prior art and how to OBJECTIVELY determine code usefulness. ORCHESTRATOR STARTING ANSWER (to be verified and extended by a WebSearch-backed research pass, since knowledge has a cutoff): usefulness is not intrinsic but RELATIONAL, made objective by making it FALSIFIABLE, the direct analog of mutation testing (mutation asks 'if I change this, does a test catch it?'; usefulness asks 'if I REMOVE this, does anything observably notice?'). Operational definition: code earns its keep iff removing it causes an observable loss (a test fails, the build breaks, a downstream dependency breaks, a production metric/behavior changes, or a documented requirement / public-API contract is violated). PRIOR-ART CLUSTERS to survey and cite: (1) static unused-code/reachability detection (compiler/linter dead-code, call-graph, `cargo-udeps`/`cargo-machete`, vulture, staticcheck, Knip, tree-shaking), blind to reflection/FFI/dynamic-dispatch/public-API; (2) dynamic/production usage (coverage as necessary-not-sufficient, PRODUCTION coverage / 'dark code' sampling, feature-usage telemetry tying code to user value); (3) DEBLOATING research (CHISEL, RAZOR, TRIMMER, piecewise compilation; delta-debugging / 1-minimality, Zeller), operationalizing keep-what-observed-use-needs; (4) mutation testing and its INVERSE, 'pseudo-tested methods' (Niedermayr et al.: body-nulling survives all tests -> effectively untested/weak-value), generalizable to a DELETION experiment; (5) behavioral-code-analysis / maintenance-cost hotspots (Tornhill/CodeScene churn x complexity, Feathers), the burden side; (6) traceability/provenance (code mapping to no requirement/test/API contract is suspect; connects to this repo's provenance direction). MULTI-SIGNAL DESIGN to propose: combine reachable/depended-on? (static) + exercised? (coverage) + deletion-safe? (deletion/pseudo-test mutant survives tests + canary, the strong signal) + traceable? (requirement/API contract; public API a legit keeper) + cost>value? (hotspot) into an ADVISORY report of candidates-not-earning-their-keep with per-signal evidence, fed into the triage/implement loop where a human decides each deletion (NEVER auto-delete; Chesterton's Fence; public-crate API surface excluded or deprecation-cycled). WORKFLOW FIT: run periodically at acceptance/UAT or on a cadence, reusing the `checks` module (already runs lint/format/test/mutation kinds in an isolated worktree) + the `review` entry mode; the deletion experiment maps onto the planned mutation module. This is `exploring`: the human directed (2026-07-19) recording it now and running the research pass AFTER the Q-51 Mealy exploration synthesises. A WebSearch-backed research pass is owed (lenses: a prior-art survey with citations; the concrete multi-signal design + `checks`/`review`/`mutation` composition; a skeptic lens on false-positives, the public-API/semver problem, and the auditor's own maintenance cost). Design record: `docs/plans/code-value-audit.explorations/`.

DESIGN PASS DONE (2026-07-24): four worktree-isolated explorers wrote `docs/plans/code-value-audit.explorations/Q-52-prior-art-survey.md` (prior-art, citations verified by curl against arXiv/dblp/GitHub/research.google because the harness WebSearch/WebFetch were down all run; the four security-venue debloating papers cited from knowledge, flagged not re-fetched), `Q-52-multi-signal-design.md` (the concrete report schema + `checks`/`mutation` mapping), `Q-52-skeptic.md` (adversarial), and `Q-58-ablation-design.md` (the folded Q-58 output-content ablation design). CONVERGENCE (all lenses): the report is ADVISORY and never auto-deletes, a human decides each candidate (Chesterton's Fence); build CHEAP-STATIC-FIRST and defer the expensive deletion experiment; that deletion experiment IS the reserved `Kind::Mutation` module (`src/checks.rs:94-95`, reusing `checks`'s isolated-worktree machinery), not a second mechanism; "nothing noticed" is necessary-not-sufficient (a candidate, never proof, and only relative to the named oracle set), so the report must carry a "not evidence of absence" caveat; the CLI/output/pack contract, `#[cfg(...)]`-gated, and FFI surfaces must be excluded before a human sees the report; churn x complexity is a RANKING (remediation) signal, not a deletion signal. RESOLVED divergence: the crate is a PURE BINARY (no `src/lib.rs`, no `[lib]`, all modules private `mod`), so there is NO downstream Rust library API and the skeptic's "structurally irreducible public-API false positive" largely does not apply here; the only contract to exclude is the CLI/output/pack surface, which makes the cheap static slice notably low-false-positive FOR THIS REPO. SHARPEST SKEPTIC CUT (Minimal by default): `cargo clippy --all-targets -- -D warnings` (already required pre-commit) plus rustc `dead_code` already cover the cheap private-dead-code case at zero marginal cost, so the incremental value of a heavier multi-signal tool is unproven; the skeptic recommends deferring the deletion experiment behind an EVIDENCE GATE (a measured count of cases where clippy passed but a deletion experiment would have caught real dead code). Status -> `open`: the design pass is complete and a human decision is owed on WHAT TO SCHEDULE (the cheap static report now vs defer-all-behind-the-gate) and, for the composed Q-58, whether to RUN the ablation now given its designer flagged oracle circularity (it can prove the RESUME STATE echo's value, V0 vs V1/V2/V3, but not the derived ACTIVE LOOP block's, whose next-action IS the oracle) and that the landed source-side fix already defused the acute 150 KB problem. Design records under `docs/plans/code-value-audit.explorations/`.

DECISION (human, 2026-07-24): schedule the CHEAP STATIC report now and GATE the rest. New step `code-value-audit-static` (86, not-started) builds only the zero/low-cost static report (rustc `dead_code` + `#[allow/expect(dead_code)]` markers + `cargo-machete` -> advisory `docs/plans/<task>.code-value-report.md`), excluding the CLI/output/pack contract + `#[cfg]`-gated + FFI surfaces and carrying a `not evidence of absence` caveat, never auto-deleting (Chesterton's Fence). New step `code-value-audit-deletion-experiment` (87, deferred) records the deletion experiment as the reserved `Kind::Mutation` module reusing `checks`'s isolated worktree, gated behind an EVIDENCE GATE: a measured count of cases where `clippy -D warnings` passed but the deletion experiment would catch real dead code (mirroring the Q-51 / Q-59 / Q-64 staged-behind-gates precedent). Chosen over defer-all (rejected: a cheap, low-false-positive win exists for this pure-binary crate, which has no downstream Rust API; Ground decisions in evidence) and over scheduling the fuller audit now (rejected: the deletion experiment is the expensive high-false-positive part the skeptic and the debloating prior-art both gate; Minimal by default). Serves Minimal by default (cheap slice only), Ground decisions in evidence (gate the expensive part, per-signal `file:line` evidence), Prefer the cleaner long-term architecture over the smallest diff (reuse `checks` / `mutation`, one report), Structured data first, project for humans (JSON intermediate -> Markdown). Folded into `code-value-audit-static`, with the deferred `code-value-audit-deletion-experiment` sibling. Decision receipt `type:"decision"` `q_id:"Q-52"` in `docs/metrics/workflow.jsonl`."""

