note = "Four work-review rounds, 24 valid findings (9, 5, 6, 4), severity ceiling high, high, medium, high, and the streak never left 0 of the 2 its risky class needs. THE CAUSE IS ONE FUNCTION: `resume_roots`, the root-supply policy, was rewritten four times and EVERY rewrite produced a finding in the next round, three of them the round's only product defect and each found by the adversarial-construction lens rather than by reading. Rounds 2 and 4 each closed a `high` that the previous round's fix had opened, and the round 4 triager proved the round 4 leak byte-identical to the round 2 one, reached through a different branch of the same function. The other twenty findings were test-coverage gaps on already-correct behaviour and prose whose scope had drifted past its evidence. Convergence became arithmetically impossible at round 4, since a clean round 5 would reach a streak of 1, so the human escalated and authorised a specific fix that closes the loop: a one-token polarity change measured by the triager before it was prescribed, plus the two red-then-green tests the line had never had (both polarities left the suite green), plus a documentation sweep. The counters RETIRE rather than reset, the reset option having been put explicitly and declined. Verified after the fix: the round 2 high, the round 3 medium and the round 1 high all still closed, each reproduced first-hand by the orchestrator against a binary built from the parent commit. Two residuals are carried and recorded in the ledger, both fail-safe refusals: the single-anchor `..` case, whose bound this fix widened by exactly one measured case, and `ADV-2`'s rejected-ledger context slot."

[[step.waiver]]
