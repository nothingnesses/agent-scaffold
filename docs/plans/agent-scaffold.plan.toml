ask = "session preflight and adherence confirmation: the workflow has no defined moment where the orchestrator confirms, with the human, the process, the disciplines it requires, and the isolation modes/tools available, so adherence is assumed rather than established (the `pause.md` skip and the untested isolation both trace to this). Decided (human, 2026-07-16): add a preflight step the orchestrator runs before the workflow starts (at kickoff) and whenever it is resumed (post-compaction or post-pause), in which it reviews the workflow process and its disciplines, detects and states the available writer-isolation modes and tools (container via `agent-box`/`agent-images` if wired, else git worktree, else the file-safety fallback), and confirms with the human what it will do to adhere before proceeding. Also folds in the human's standing directive to ALWAYS use separate, isolated (worktree-first) writer agents where possible, so the orchestrator drives and reviews but does not implement code directly. Folded into `session-preflight`."
folded_into = "session-preflight"

