ied restatement (which would drift). Folded into `single-source-recommendation-rule`; decision receipt `type:"decision"` `q_id:"Q-60"` in `docs/metrics/workflow.jsonl`."""

[[question]]
id = "Q-61"
status = "decided"
folded_into = "uniform-agent-isolation"
receipt = "Q-61"
ask = """the uniform-agent-isolation decision. DECIDED (human, 2026-07-23): EVERY spawned agent runs in worktree isolation (the strongest isolation tier the harness supports, tier order unchanged), and the orchestrator merges all their outputs onto main. This replaces the previous design where the read-only reviewers and the triager wrote their findings directly into main's `docs/plans/<task>.reviews/`: they now write those findings in their OWN worktree, which the orchestrator merges, and the cross-tree-readability and survival property is preserved because the merge puts the findings onto main. Two refinements: (1) when multiple agents run in PARALLEL (several reviewers in a round, or several explorers), the orchestrator merges their worktrees only AFTER they ALL finish (a batch-merge), never as-each-completes, so no interleaved partial state reaches main mid-round; a single non-parallel agent is merged after it finishes or converges as before; (2) the tool's emitted instructions must STATE this (the pack: `AGENTS.md` and the orchestrator / reviewer / triager prompts), not only the guidance prose. This SUPERSEDES the former "read-only agents need no isolation" carve-out and RESOLVES the explorer-classification inconsistency (explorers are read-only with respect to the reviewed product, since they author only advisory design notes and not the plan or the code, but they still isolate like every spawned agent, so they are no longer listed among read-only agents needing no worktree). Chosen over a narrow change to only the findings-writing mechanics, and over keeping direct-to-main findings. Decision receipt: `type:"decision"` `q_id:"Q-61"` in `docs/metrics/workflow.jsonl` (Q-61 is past the `Q-44` baseline, so W4 enforces the receipt). Decision and reasoning in `uniform-agent-isolation`."""

[[question]]
id = "Q-62"
status = "decided"
folded_into = "driver-isolation-reminder-scope"
receipt = "Q-62"
ask = """the driver-reminder scope follow-up from `Q-61`. Now that the uniform-isolation rule makes the reviewers, the triager, and the explorers isolate too (not only the writers), should the `next` driver emit its worktree-isolation reminder at the reviewer / triager-spawn states as well, or is `spawns_writer` still the right scope? Currently `spawns_writer` (`src/next.rs`) returns true only for `ReadyToPlan` (spawns the planner) and `AwaitingFixes` (spawns the implementer), so the always-on isolation reminder attaches only at those two writer states; the review states (`AwaitingFirstReview`, `AwaitingReviewers`) carry no isolation reminder, and the content-pin test `the_reviewer_states_carry_no_isolation_reminder` pins that. When `Q-61` landed, the driver behaviour was deliberately left unchanged and a NOTE was added in `spawns_writer` flagging this as a still-open decision, because the isolation reminder there also carries the writer's resolved tier and its resolve-the-tier note, which concern the writer's product-content blast radius. Candidates (not pre-decided): (a) widen `spawns_writer` (or add a sibling predicate) so the isolation reminder also fires at the reviewer / triager-spawn states, matching the uniform rule at the point of action, and flip the pinning test; (b) keep `spawns_writer` as-is on the ground that the isolation instruction for the read-only agents is already carried by their role prompts (`reviewer.md`, `triager.md`) and by `AGENTS.md`, so the driver reminder need not duplicate it, and the driver reminder stays about the writer's tier echo; (c) split the reminder so a lighter isolate-in-a-worktree reminder fires at every spawn state while the tier-echo / resolve-note stay writer-only. Judged against the plan principles: P1 (one uniform rule, no drift between guidance and driver) leans toward (a) or (c); P2 (minimal by default) and the no-duplication direction lean toward (b). Do not change driver behaviour until decided. DECIDED (human, 2026-07-23): option (a), WIDEN the reminder to fire at the reviewer / triager-spawn states too. The future build widens `spawns_writer` (or adds a sibling predicate) in `src/next.rs` so the isolation reminder attaches at the review-spawn states (`AwaitingFirstReview`, `AwaitingReviewers`), and flips the content-pin test `the_reviewer_states_carry_no_isolation_reminder`. Reasoning: P1 wants one uniform rule with no drift between the guidance and the driver, and since Q-61 makes every spawned agent isolate, the reminder belongs at the point of action for the review-spawn states, not only the writer states. Chosen over (b) keep-writer-only (which leaves the driver silent exactly where an agent is about to be spawned) and over (c) split-the-reminder (extra surface for no clear gain here). This is a `src/next.rs` code change plus flipping the pin test, deferred as a build step rather than done in this fold pass. Folded into `driver-isolation-reminder-scope`; decision receipt `type:"decision"` `q_id:"Q-62"` in `docs/metrics/workflow.jsonl`."""

[[question]]
id = "Q-63"
status = "decided"
folded_into = "triager-runs-only-on-findings"
receipt = "Q-63"
ask = """whether the separate triager should run only on review rounds where the reviewers produced one or more findings, rather than on every review round. Now that a review round can come back with zero findings from every reviewer, running a triager on such a round has nothing to adjudicate: the round is already clean. The question is whether to make the triage step conditional on there being findings, and whether that carve-out weakens the never-collapse property that keeps the orchestrator (which owns convergence and cost and is biased toward dismissing findings) from triaging itself. Candidates: keep the always-run rule (a triager on every round including zero-findings ones); adopt the findings-only rule for the convergence loop only; adopt it for every reviewers-then-triager pass. DECIDED (human, 2026-07-23): adopt the findings-only rule for ALL reviewers-then-triager passes. The separate triager runs on any review round in which the reviewers raised one or more findings; a round where every reviewer reports zero findings is already clean and needs no triage, because there is nothing to adjudicate. "Zero findings" is read objectively from the committed reviewer findings files, NOT at the orchestrator's discretion, so it cannot become a way to suppress findings. When the triager DOES run it is still ALWAYS a separate agent (or a human), never collapsed into the producer or the orchestrator; that never-collapse property is unchanged, because letting the orchestrator triage would let its dismissal bias decide which findings count. This applies to every reviewers-then-triager pass: the plan-review and work-review convergence rounds, the acceptance pass, and the review-entry-mode pass. Chosen over keeping the always-run rule and over a loop-only carve-out. This is guidance-only for now; the driver (`src/next.rs`) reflects it later when the workflow FSM models a triage transition, which is deferred, evidence-gated driver work. Folded into `triager-runs-only-on-findings`; decision receipt `type:"decision"` `q_id:"Q-63"` in `docs/metrics/workflow.jsonl`."""

[[question]]
id = "Q-64"
status = "decided"
folded_into = "generated-projection"
receipt = "Q-64"
ask = """whether a separate AGENTS.md prose file should continue to exist at all once the tool matures, or whether the agent-scaffold tool alone can encode, enforce, and deliver the workflow. Raised by the human 2026-07-23 (Socratic), in two parts: (1) does AGENTS.md still make sense, is the tool by itself insufficient; (2) if the tool is insufficient without AGENTS.md, how far can it be pushed toward self-sufficiency.

STARTING ANALYSIS (orchestrator, to be tested and extended by the design pass): the tool ALONE is insufficient, but a hand-maintained prose AGENTS.md is also the wrong end state; the clean answer is a GENERATED AGENTS.md that is single-sourced with the tool, not prose versus tool. Three things AGENTS.md does that a driver or validator cannot replace: (1) it carries JUDGMENT and behavioral guidance the tool can prompt but never enforce (adversarial review quality, sound triage, front-loading context, well-reasoned recommendations, prose conventions), which is the control-versus-judgment boundary the project already drew for `Q-51`; (2) BOOTSTRAP and harness-agnosticism, something loaded by default must tell the agent the tool exists and be present on a harness that does not auto-run executables; (3) the HUMAN-READABLE contract (Principle 8 is literally structured data first, project for humans). Why a static hand-maintained AGENTS.md is ALSO wrong: it is the drift the project exists to kill (two independent copies of the same rules diverging), already hit as the driver principle-numbering bug and the W4-baseline doc drift.

THE SYNTHESIS, and the trajectory the project is already on: one structured source defines the workflow; the tool's enforced behavior, the tool's just-in-time emitted instructions (`next`), and a GENERATED AGENTS.md are all projections of it, so the prose cannot drift from the code and still carries the three residual jobs. Already done for one slice: `ISOLATION_POLICY_FRAGMENT` is single-sourced into the `{{isolation_policy}}` AGENTS.md slot AND emitted by the driver; `Q-51`'s own text names generating the AGENTS.md workflow section from the machine definition; the `Q-60` decision (render duplicates from a single source, not pointers) is the same principle on one rule.

HOW FAR the tool can be pushed toward self-sufficiency, the LADDER (what to build): (1) DELIVERY, make `next` the just-in-time channel that emits the relevant slice (the role prompt filled with context, the phase's rules, the applicable principles, the resolved isolation tier, the convergence state, the next action) at each state, so the agent asks the tool what now rather than holding AGENTS.md in context; needs the per-unit FSM, the state reconstructor, and per-state instruction templates. (2) SOURCE, move the workflow LOGIC into one structured spec (widen `workflow.toml` from convergence constants to states, transitions, guards, and templates) that the tool interprets, and generate the AGENTS.md workflow section from it, so no hand-authored logic prose is left to drift. (3) ENFORCEMENT, widen the mechanical checks and own the transitions: event-recording subcommands (`record-round`) that append and advance atomically (`Q-51` Stage 3, Principle 5), the opt-in `validate --workflow --strict` boundary gate that blocks a non-conforming landing (`Q-51` ORQ-1), and more invariants. (4) BOOTSTRAP, shrink AGENTS.md to a generated stub plus contract that the tool itself emits.

THE IRREDUCIBLE FLOOR, what the tool cannot cross at any maturity: (a) JUDGMENT (is this finding valid, is this design sound, is the recommendation well reasoned), consumed as input and never made; the judgment-eliciting prompts are content the tool delivers but whose quality it cannot verify. (b) UNOBSERVABLE behavioral compliance (did the reviewer read the diff, was context front-loaded), only proxied by required artifacts. (c) SELF-BOOTSTRAP, on a harness that does not auto-run the tool a few loaded-by-default lines must point at it, which cannot be zero. The test for whether a rule can move into the tool: is it CHECKABLE, or only PROMPTABLE; checkable rules become enforcement, promptable ones become tool-delivered prose but are never enforced.

This COMPOSES with `Q-51` (this is essentially completing the full workflow-driver vision plus widening generation) and `Q-58` (the structured transient is one input the state reconstructor needs), so the design pass should reconcile `Q-64` WITH `Q-51` and `Q-58` rather than treat it standalone. Judged against the plan principles: P8 (structured data first, project for humans) and P1 (cleaner long-term architecture) drive the generated-projection direction; one-source-of-truth is the anti-drift argument; P2 (minimal by default) and P6 (evidence first, adopt in stages) caution against building the whole ladder speculatively, which is why this is `exploring` rather than decided. Orchestrator starting recommendation for the pass to weigh: direction A, keep AGENTS.md but demote it from an authored source to a GENERATED projection of the single workflow source, with the tool as the logic source, the structural enforcer, and the just-in-time deliverer, and the residual floor (judgment prompts, bootstrap stub, human contract) staying as generated prose.

This is `exploring`: a multi-explorer design pass is owed (candidate lenses: the generation architecture, how far to render AGENTS.md from the single source and what stays hand-authored; the checkable-versus-promptable partition of the current AGENTS.md content; the delivery and FSM path reusing the `next`, `render`, and W3 machinery; and a YAGNI or skeptic lens on how much of the ladder is worth building versus the drift it removes). Design record owed under `docs/plans/agent-scaffold.explorations/` named for `Q-64`. DECIDED (human, 2026-07-23): Option A refined. Adopt direction A (slot-wise generation, AGENTS.md stays a hand-authored template with generated slots, not whole-file generation). Build the endorsed rung-1 core NOW (the whole-file AGENTS.md drift guard, principle-by-name projection replacing fragile numeric citations, the roles / findings-naming generated slots, plus the promoted Q-60 recommendation-rule single-source and Q-62 isolation-reminder widening), and GATE the contested workflow.toml rule-fragment widening plus the `{{workflow_phases}}` phase-machine section generation behind the sec-2(d) evidence gate. Folded into `generated-projection`; decision receipt `type:"decision"` `q_id:"Q-64"` in `docs/metrics/workflow.jsonl`."""

[[question]]
id = "Q-65"
status = "decided"
folded_into = "rename-to-agent-flow"
receipt = "Q-65"
ask = """whether, given the project's trajectory (the `Q-51` workflow-driver and the `Q-64` tool-self-sufficiency direction), agent-scaffold is still primarily a SCAFFOLDING tool or has become a structured WORKFLOW ENGINE / DRIVER, and if the latter whether to RENAME it, and to what. Raised by the human 2026-07-23 (Socratic); the human is not precious about the current name and is unconcerned with backwards-compatibility or brand recognition.

IDENTITY ANALYSIS (orchestrator, to be tested by the design pass): the project is no longer primarily a scaffolding tool. The `scaffold` subcommand (the one-shot pack generator) is becoming ONE bootstrap subcommand of a larger thing whose ongoing value is the plan/metrics/convergence machinery plus the driver: `validate --workflow` ENFORCES structural invariants, `render` PROJECTS the structured plan for humans, and `next` DRIVES the loop. It is best described as a HARNESS-AGNOSTIC, STRUCTURED WORKFLOW ENGINE or DRIVER (a control plane for a role-separated, convergence-gated development workflow). It is NOT a META-HARNESS: a harness runs the agent (the LLM loop and tool execution), which this tool never does; agents INVOKE the tool, so calling it a meta-harness is a category error.

RENAME: worth it. A name that says scaffold keeps implying a one-shot generator and mis-sells a workflow driver, a small permanent comprehension tax; since the human is not precious about the name, there is little reason to keep a misdescriptive one. TIMING: the name should FOLLOW the settled identity, and `Q-64` is the pass that settles how central the driver identity is, so this question is resolved AS PART OF the `Q-64` design pass (which should crystallize the identity and produce a name recommendation), rather than picked in a vacuum.

CANDIDATE NAME DIRECTIONS to seed the pass: DESCRIPTIVE (lowest cognitive cost, fits the project's clarity and project-for-humans values), for example `agentflow`, `flowgate` (the workflow plus the convergence gate it enforces), `agentctl` (a CLI-conventional control tool); METAPHOR (drives the crew but never does the work, which is the orchestrator rule), for example `cox` or `coxswain` (steers and paces a rowing crew without rowing, precise but obscure), `maestro` or `podium` (conducts an ensemble from one score, the structured plan; the conductor does not play), `helm`. Orchestrator lean: a DESCRIPTIVE name over a metaphor (this project values clarity over cleverness), with `agentflow` or `flowgate` as front-runners, but let the `Q-64` explorers pressure-test the identity first and let the name fall out of it.

Judged against the plan principles: P8 (structured data first, project for humans) and P1 (cleaner long-term architecture) argue the public name should accurately project the tool's identity. This is `exploring`, resolved TOGETHER WITH `Q-64` (its identity conclusion determines the name); no separate design pass is owed beyond `Q-64`'s, this question rides along with it. DECIDED (human, 2026-07-23): renamed to `agent-flow` (descriptive), release-timed to a stable release-ready state so the name can be claimed on crates.io. Reserve `agent-flow` on crates.io at 0.0.2 with the first real release under the new name at 0.0.3; the final agent-scaffold publish (0.0.2) links to agent-flow and states that the agent-scaffold name is free to reclaim by opening an issue on the agent-flow GitHub repo. Identity is a structured workflow validator plus advisory driver (scaffold is one bootstrap subcommand), NOT a meta-harness (category error: agents invoke the tool, it never runs the LLM loop). Folded into `rename-to-agent-flow`; decision receipt `type:"decision"` `q_id:"Q-65"` in `docs/metrics/workflow.jsonl`."""

[[question]]
id = "Q-66"
status = "decided"
folded_into = "reviewer-reproducible-evidence"
receipt = "Q-66"
ask = """whether every reviewer finding must carry reproducible evidence, and of what strength, so a finding can be reproduced and adjudicated on its evidence rather than taken on the reviewer's word. DECIDED (Socratic, human, 2026-07-26): TIERED REPRODUCIBLE EVIDENCE. Every reviewer finding must carry reproducible evidence PROPORTIONAL to its claim. For a BEHAVIORAL or correctness claim (a panic, non-determinism, a wrong output, or "this test is vacuous"), the reviewer provides a RUNNABLE demonstration; the strongest form is a MUTATION, to prove "test T does not really cover code C", break C and show T still passes (the pseudo-tested-method logic that the reserved `Kind::Mutation` variant `src/checks.rs:94-95` and the deferred `code-value-audit-deletion-experiment` step 87 build on, sharing the same isolated-worktree machinery; the reviewer runs the demonstration in its own isolated worktree, which every spawned agent already gets under the uniform-isolation rule). For a DOC, DESIGN, or style claim (stale help text, an em-dash, a naming-collision risk), the reproducible evidence is an EXACT command (grep, diff, or build output) or a `file:line` citation, NOT a contrived test. The TRIAGER reproduces whatever the reviewer provided and DISMISSES any testable claim whose demonstration does not reproduce. Rationale: the requirement makes findings falsifiable and checkable (Ground decisions in evidence, plan Principle 6; Reproducible, plan Principle 7), which is the AGENTS.md workflow guidance "Verify, don't trust" and "Cite sources rather than asserting from memory" applied to the review loop, and "Tests must actually exercise the code they claim to" made enforceable through the mutation demonstration; the counterweight is that the evidence is SCALED to the claim type so it never forces a contrived test where a command or a citation suffices (proportional, not maximal; Minimal by default, plan Principle 2). Chosen over a runnable test for EVERY finding (rejected: forces contrived tests for doc and style claims, over-maximal), over a triager-enforced reviewer-SHOULD (rejected: leaves the evidence optional, so a bare assertion can still stand), and over keeping the current process (rejected: a finding can be taken on the reviewer's word). The work this schedules folds the rule into `pack/prompts/reviewer.md`, `pack/prompts/triager.md`, and `pack/AGENTS.md` (the Reviewers and Triager role bullets and/or the Findings files section), then regenerates the deployed `.agents/` copies via `just scaffold-self`. Folded into `reviewer-reproducible-evidence`; decision receipt `type:"decision"` `q_id:"Q-66"` in `docs/metrics/workflow.jsonl` (Q-66 is past the `Q-44` baseline, so W4 enforces the receipt). Decision and reasoning in `reviewer-reproducible-evidence`."""

