ask = """encode the workflow itself as a deterministic state-machine DRIVER (not just a post-hoc checker) to combat AGENT DRIFT as the workflow grows and accrues detail (agents forget to apply rules): the human proposed (2026-07-19) making `agent-scaffold` a Mealy-machine REPL that the orchestrator (or any agent/human) runs to keep driving the loop. It would (a) parse the current codebase + plan/ledger/metrics state into valid internal control states, (b) print a summary of the current state, the valid transitions it can take, and CRUCIALLY the next INSTRUCTION PROMPT for the agent (the role prompt with context filled in) based on that state, plus periodic reminders (for example the Project Principles). Documentation instructs agents to run it to receive further instructions, so the control flow lives in a deterministic program rather than in fallible agent memory. This is the natural third stage of the structured-data direction (structured SOURCE `plan.toml` -> structured ENFORCEMENT `validate --workflow` -> structured DRIVING, this idea) and builds directly on the machine-readable plan the `structured-skeleton` initiative just delivered. ORCHESTRATOR REFRAMING (to weigh in the design pass): it is not one global Mealy machine but a FLEET of per-unit control FSMs (one per active step / increment / review loop), the tool tracking the set and emitting the next instruction for each READY unit, and also acting as a DEPENDENCY SCHEDULER over the plan's `blocked_by` DAG (computing what may run in parallel now); the tool must own only CONTROL transitions and consume agent/human JUDGMENT as inputs (a triage verdict, a human decision, a commit), never make the judgments itself (get that boundary wrong and it either straitjackets or hallucinates decisions). HUMAN'S CONCERNS to resolve: (1) interaction with the writer-isolation tiers (orthogonal: the tool instructs, the orchestrator isolates; the tool reads durable state on main and can emit the resolved tier as part of the instruction); (2) parallel steps (the per-unit-FSM fleet + dependency scheduling above); (3) concrete inputs and outputs (candidate: input = the durable state plus event-recording subcommands like `record-round --outcome clean` that append the log AND advance state atomically, Principle 13; output = a per-unit state summary + valid transitions + the filled next-instruction prompt + Principle reminders, as JSON and human text; keep it STATELESS, recompute from the files each call so it survives crashes/compaction); (4) what is missing. ADDITIONAL CONSIDERATIONS the orchestrator raises for the pass: the tool would become the SOURCE of the workflow LOGIC (convergence/sequencing move from AGENTS.md prose into Rust), the strongest anti-drift property but the biggest cost, and the prose and code could themselves drift unless the AGENTS.md workflow section is GENERATED from the machine definition (the same render closure just built for the plan); ESCAPE HATCHES for exceptions and human overrides are mandatory or the tool becomes a cage; ADOPTION should be EVIDENCE-FIRST (Principle 6), start ADVISORY (the agent drives, the tool suggests, measure whether drift drops) then deepen to authoritative driving, mirroring the receipt/waiver pilots; and this OVERLAPS the queued drift-mitigation cluster (the re-grounding + provenance step and the `Q-50` doc-currency core guidance), so the pass must weigh whether the driver SUBSUMES them. This is a MAJOR initiative, larger than `structured-skeleton`, and genuinely design-open, so it is `exploring`: the human directed (2026-07-19) queueing the exploration FIRST, before folding the Q-50 / re-grounding work it overlaps. A multi-explorer design pass is owed (candidate lenses: a formal-FSM + concurrency model; the tool-vs-prose single-source boundary + AGENTS.md generation; the I/O contract + isolation/harness integration + advisory-first adoption; and a YAGNI/skeptic lens weighing the state-machine driver against the lighter drift mitigations), synthesised, then moved to `open` with options for the human. Design record: `docs/plans/mealy-workflow-driver.explorations/`. DESIGN PASS DONE (2026-07-19): four independent explorers (fsm-concurrency, tool-vs-prose, io-contract-and-adoption, yagni-skeptic) synthesised in `synthesis.md`. STRONG CONVERGENCE: build the ADVISORY MVP first (a read-only, stateless `agent-scaffold next` reusing the W3/W4/W5 reconstruction already shipped, largely the already-planned `state-queries` step plus a next-action reminder), DEFER the full driver (per-unit FSM fleet, `blocked_by` scheduler, event-recording write-path, AGENTS.md-from-machine generation, authoritative driving) behind an EVIDENCE GATE, single-source the convergence CONSTANTS to close the existing `required_streak`/AGENTS.md duplication, and treat the driver as COMPLEMENTING (not subsuming) the re-grounding step and Q-50 (un-gate those; Q-50 is a prerequisite if the driver is built). Options for the human: (A) build the advisory MVP evidence-gated [all four explorers recommend]; (B) build the full driver now [rejected as premature, a subsystem larger than structured-skeleton hardening an evolving workflow]; (C) do not build, rely on the lighter drift mitigations. Orchestrator recommendation: (A). HUMAN DIRECTION (2026-07-19): go with the FULL DRIVER (Option B) as the TARGET, but a DEEPER design pass is owed FIRST, brainstorm the design space, requirements, scope, and possible user flows before committing to a build, so this stays `exploring` (a second design pass owed, not yet decided). Orchestrator note carried into that pass (honouring the skeptic's main objection while enabling the full driver): keep the workflow LOGIC DATA-DRIVEN (a spec the tool interprets, not hardcoded Rust) so the workflow can still evolve without heavy code churn, and STAGE the build (the advisory tier is the natural first increment on the path to the full driver, reusing the W3/`state-queries`/`render` machinery). ROUND 2 exploration qu