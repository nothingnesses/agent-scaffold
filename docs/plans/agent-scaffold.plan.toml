ask = """whether the pack `source` read escape, found during the `v0.0.2` implementation and reported rather than fixed, is fixed inside `ship-v0-0-2`, whose own sidecar declares its scope closed. THE DEFECT: an `[[asset]].source` in a `--template` pack can name a path outside the pack directory, because `PackSource::Directory::read` (`src/manifest.rs:307`) is a bare `root.join(rel)` and `src/manifest.rs:44` only documents the field as "within the pack", so `scaffold` copies an arbitrary readable file into the scaffolded project under a legal `dest`. It is the read-side twin of the `F4` write escape this step already fixes, in the same struct, and the containment predicate that closes it is created by the `F4` fix in the same change. REPRODUCED INDEPENDENTLY by the orchestrator and again by the planning pass at `d06f1b5`: a pack whose only asset carries `source = "../secret.md"` and `dest = "leaked.md"` exits 0, prints `create  leaked.md`, and lands the outside file's contents in the scaffolded project; an absolute `source` does the same. OPTIONS PRESENTED: (a) fix it in this step; (b) ship 0.0.2 without it and fix it in the next step; (c) ship it and document the trust boundary in the README, as `src/checks.rs:17-26` argues for `.agents/checks.toml`. DECIDED (human, 2026-08-13): (a), which was also the orchestrator's recommendation. THE REASONING THE HUMAN ACCEPTED: it is one bounded application of a predicate that already exists in this change rather than newly discovered work; enforcing containment on `dest` but not on `source` in the same struct is an incoherent boundary rather than a smaller one (Principle 5, Make illegal states unrepresentable, and Principle 1, Prefer the cleaner long-term architecture over the smallest diff); and taking it before the review round costs no extra rounds, because `ship-v0-0-2-inc1` is `low_risk` and one clean round converges it. THE REASONING AGAINST, WEIGHED AND OVERRIDDEN RATHER THAN ABSENT, RECORDED SO THE EXCEPTION STAYS VISIBLE AS ONE: the step's own sidecar states that its purpose is delivery, so its scope is closed and every addition to it defeats it; and the 2026-08-13 audit measured steps generated by the process itself at 8.3% before the 2026-07-19 to 07-31 turn and 54.2% after it, marked monotonic, so "just this once, it is small" is the exact habit that produced that number. REJECTED (b) because the two escapes are one boundary, and shipping half of it leaves the same struct enforcing containment on one field and not the other, which a later step then has to revisit. REJECTED (c) because a `--template` pack is external input the user may have fetched from anywhere, whereas `.agents/checks.toml` is the user's own configuration in their own repository, so the trusted-config argument does not carry over; this is the argument `ship-v0-0-2` already makes against the same option for `F4`. THE SCOPE IS WIDENED ONCE AND THE CLOSED-SCOPE SENTENCE STANDS: this decision is its only exception, and a second addition needs its own human decision rather than this precedent. Folded into `ship-v0-0-2`, whose sidecar carries the defect as `F4b` with the site, the reproduction and the acceptance criteria; decision receipt `type:"decision"` `q_id:"Q-75"` in `docs/metrics/workflow.jsonl`. Decision and reasoning in `ship-v0-0-2`."""

[[question]]
