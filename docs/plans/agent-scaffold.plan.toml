[[question]]
id = "Q-34"
status = "decided"
ask = "unify round/review data on the JSONL log (single source of truth, comprehensive): evidence found while scoping `ledger-parse` (2026-07-16): structured per-round data is DUPLICATED across the ledger's `## Round summaries` table (stale at 2 rows) and the metrics JSONL (comprehensive, 52 rows, richer: `risk_class`, reviewer attribution, severities, `ts`, cross-task), violating single-source (Principle 16). DIRECTION DECIDED (human, Approach 1): promote `docs/metrics/workflow.jsonl` to the always-present structured workflow ROUND LOG (round logging becomes core, not opt-in), REMOVE the ledger's round-summary and findings-index tables (the ledger keeps only the Round-records narrative + RESUME STATE), and have convergence accounting, `workflow-invariants`, and `state-queries` all read the JSONL; per-finding detail stays in the review files (git history). The human accepts backwards-compat breaks for the optimal long-term shape. This REOPENS folded decisions (`instrument-flag` `Q-4`/`Q-5`/`Q-6` the `--instrument` opt-in gate; `ledger-template` `Q-2`/`Q-3` the tables; `convergence-accounting` `Q-1` counting from the ledger; `Q-24` metrics validation now core) and re-scopes `ledger-parse` (down to a RESUME-STATE text extract, likely folded into `state-queries`) and `workflow-invariants` (reads the JSONL). A DESIGN PASS is owed (human-chosen) to pressure-test Approach 1 and produce the concrete MIGRATION plan: the `--instrument` disposition (drop vs repurpose), the always-on round-log rendering (the `instrument.md` fragment becomes core AGENTS.md content), the ledger-template edits, the convergence-accounting doc change, which existing steps reopen and in what order to keep the repo green, and the (minimal) data migration since the 52-record JSONL already covers all rounds. GATES the remaining process cluster (`ledger-parse`/`workflow-invariants`/`state-queries`) until the migration plan is decided."
