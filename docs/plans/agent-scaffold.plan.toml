metrics::parse_decisions` projection, a W4 `validate --workflow` check that every `QUEUE_FOLD_PREFIX` (`decided`) item has a matching `q_id` receipt (forward-looking, historical Q-1..Q-41 exempt via the log's absence), `src/plan.rs` and the plan-template BYTE-IDENTICAL, plus the CONVENTION that a `decided` item's prose does NOT re-enumerate the option labels (the receipt is their machine home; the prose carries rationale + the pointer), stated in `pack/AGENTS.md`/`pack/plan-template.md`. The SOLE difference is a ~30-35 line thin RENDER in the existing `status` command (a `DecisionProjection` slot in `Projection`, populated from `parse_decisions`, shown in `status --json` and the human summary): A says defer it (it is (a)-plus-sugar, does not itself touch the queue prose, and belongs in the planned `state-queries` step that already extends `status`); B says build it now because it creates a derived DISPLAY surface that makes the no-re-enumerate convention SELF-REINFORCING (the orchestrator, seeing options+choice already shown by `status`, has no pull to hand-copy them into prose), and BOTH note it naturally folds into `state-queries`. It is NOT the deferred `workflow-viz` (a live streaming Gantt over a dispatch/return event log, different scope); it is a one-time read of committed data like `status` already does. Orchestrator recommendation: build the SUBSTRATE (JSONL `type:"decision"` record + `chosen in options` + W4 + drift-guard + `instrument.md` docs + the convention) as a new `decision-receipt` step now (classify RISKY, it extends the enforcement backstop like `workflow-invariants`/W3 did -> two clean rounds), and FOLD the thin `status` render into the already-planned `state-queries` step where both explorers agree it belongs (keeping this increment tight; the receipt+W4 is the guarantee, the render is human-convenience, and its interim absence only means options+choice are read from the JSONL until `state-queries` lands). Awaiting the human's confirmation of t