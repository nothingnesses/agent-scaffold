ask = """how the (chosen) Full decision receipt is ENCODED and where it lives, plus the broader structured-plan idea it touches: the human chose to build a receipt (`Q-42`) but flagged that Explorer B's raw JSONL record is a second permanent hand-authored home for the option-labels+choice (the Principle 16 drift A poked), and proposed encoding the receipt as STRUCTURED DATA with a single home, then having `agent-scaffold` PROJECT it into the human-readable plan/status view. Three contender encodings to weigh: (a) B's `type:"decision"` JSONL record (matches existing instrumentation records, opt-in, leaves the core plan format untouched, but is the second home); (b) a structured block on the `decided` Open-Questions item in the plan (single home, co-located, but complicates `src/plan.rs` and changes the scaffolded plan format for every project); (c) structured receipt source + a projection/render into the human-readable view (single source, derive the view, closes the SSOT hole AND keeps the plan readable; costs a render capability that OVERLAPS the deferred `workflow-viz`). Orchestrator lean: (c), most Principle-16-aligned (one source, derive the view). SEPARATE, LARGER question this touches, recorded here but explicitly NOT bundled into the receipt build: the human's broader idea of formalising the WHOLE plan document into a uniform, machine-parseable structured file format rendered to a human view. Orchestrator caution (for its own weighing later): the plan is ~80% reasoning narrative; fully structuring a prose-heavy document fights the format (prose-in-string-fields), loses direct Markdown editing and the self-contained resume-context value (Principle 20), and is a behavior change for every scaffolded project, while the metadata regions `src/plan.rs` already parses (Roadmap + Open Questions) are the parts that genuinely benefit; the projection/visualisation half overlaps the deferred `workflow-viz`. So weigh the full rewrite on its own merits separately; the receipt only needs the narrow structured-receipt-plus-projection win. A FOCUSED DESIGN PASS is owed (human-directed, 2026-07-18); the item points at `docs/plans/receipt-encoding.explorations/`. It weighs ONLY the three encodings (a)/(b)/(c) for the already-chosen Full receipt, and is explicitly SCOPED OUT of the full-plan-rewrite (that larger question is noted here, not designed). Fixed inputs the pass may not re-open: the Full receipt is chosen (not null); the receipt records the options presented + recommendation + the human's choice with a check that the choice is among the options, plus a W4 `validate --workflow` check that every `decided` item has a receipt (forward-looking); receipts do NOT live in the ledger; `escalation`/`intake` records stay separate (one purpose per record). The pass must give concrete COST ACCOUNTING per encoding: `src/plan.rs` parser changes, `src/metrics.rs` changes, the W4 check in `src/workflow.rs`, the pack plan-template FORMAT change and its blast radius across every scaffolded project, and for (c) exactly how much projection/render machinery is needed and whether it forces the deferred `workflow-viz` to come first or a thin render suffices. It should note the existing `status --json` plan->JSON projection as prior art for (c). DESIGN PASS DONE (two explorers, `docs/plans/receipt-encoding.explorations/receipt-encoding-{A,B}.md`; A minimalist recommends (a), B architecture recommends (c)). They CONVERGE far more than they differ: BOTH reject (b) (the in-plan structured block: 60-100 lines of multi-line parser in `src/plan.rs` past its deliberate no-prose boundary, and an UNCONDITIONAL `pack/plan-template.md` queue-item format change every scaffolded project inherits whether or not it ever records a decision, Principles 2+3), and BOTH agree the receipt SUBSTRATE is identical: a `type:"decision"` JSONL record (`q_id`, `options`, `recommendation`, `chosen` with a validator check that `chosen` is a member of `options`, optional `ts`), a new `metrics::parse_decisions` projection, a W4 `validate --workflow` check that every `QUEUE_FOLD_PREFIX` (`decided`) item has a matching `q_id` receipt (forward-looking, historical Q-1..Q-41 exempt via the log's absence), `src/plan.rs` and the plan-template BYTE-IDENTICAL, plus the CONVENTION that a `decided` item's prose does NOT re-enumerate the option labels (the receipt is their machine home; the prose carries rationale + the pointer), stated in `pack/AGENTS.md`/`pack/plan-template.md`. The SOLE difference is a ~30-35 line thin RENDER in the existing `status` command (a `DecisionProjection` slot in `Projection`, populated from `parse_decisions`, shown in `status --json` and the human summary): A says defer it (it is (a)-plus-sugar, does not itself touch the queue prose, and belongs in the planned `state-queries` step that already extends `status`); B says build it now because it creates a derived DISPLAY surface that makes the no-re-enumerate convention SELF-REINFORCING (the orchestrator, seeing options+choice already shown by `status`, has no pull to hand-copy them into prose), and BOTH note it naturally folds into `state-queries`. It is NOT the deferred `workflow-viz` (a live streaming Gantt over a dispatch/return event log, different scope); it is a one-time read of committed data like `status` already does. Orchestrator recommendation: build the SUBSTRATE (JSONL `type:"decision"` record + `chosen in options` + W4 + drift-guard + `instrument.md` docs + the convention) as a new `decision-receipt` step now (classify RISKY, it extends the enforcement backstop like `workflow-invariants`/W3 did -> two clean rounds), and FOLD the thin `status` render into the already-planned `state-queries` step where both explorers agree it belongs (keeping this increment tight; the receipt+W4 is the guarantee, the render is human-convenience, and its interim absence only means options+choice are read from the JSONL until `state-queries` lands). Awaiting the human's confirmation of that split, or a choice to bundle the render into the receipt increment now. The broader full-structured-plan-format idea remains recorded here and out of scope, to weigh separately. SUPERSEDED (2026-07-18) by the human's architecture pivot: the human adopted the broader structured-data + projection direction as the target architecture (new Project Principle 8), explicitly demoting backwards-compat and blast radius, which reverses the weighting that made Explorer A's minimal-JSONL (a) win here. The decision-receipt encoding is therefore no longer a standalone minimal-footprint question; it becomes the FIRST INSTANCE of the broader architecture now opened as `Q-44`. The receipt-encoding explorations (`receipt-encoding-{A,B}.md`) still inform it (the receipt fields, the W4 check, and the reject-(b)-multi-line-parser reasoning survive; but (b)/(c)'s blast-radius penalty is now demoted). Do not build the receipt as a one-off; build it under `Q-44`."""
