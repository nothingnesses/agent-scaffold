[[question]]
id = "Q-29"
status = "decided"
ask = 'first-class support for design-space exploration / deliberation: the workflow handles deciding (the `deliberation-mode` human-input contract) and deferring (an item stays `open`) a decision, but has no first-class mode for exploring a design space BEFORE options are decidable, which is what the human asked for on `Q-27`/`Q-28`. Gaps the incident exposed: (1) the Open-Questions status vocabulary (`open` / `decided -> folded` / `superseded`) cannot express "open, a design pass is owed first" (the `validate --plan` structural check hard-rejected that phrasing when tried in the status field), so the nuance can only live in body prose; (2) there is no defined deliverable for an exploration (implementation has an artifact, a plan has plan-review, an exploration has neither, so it lives as ad-hoc orchestrator prose); (3) the exploration itself is unreviewed, though it is higher-leverage than implementation; and (4) intake names factual-answer and decision-gate modes but not "the human is asking me to deliberate", so handling falls to orchestrator disposition. Decided (human, 2026-07-16, after the two-explorer design pass): add all four, low-ceremony, mostly docs plus one code line: an `exploring` Open-Questions status (in `plan.rs`), a design-notes artifact convention at `docs/plans/<task>.explorations/<question>.md` (parallel to `.reviews/`) whose shape is the human-input contract written to a file, design-exploration as a named intake mode in `AGENTS.md`, and an optional light review of an exploration (the multi-independent-explorer-plus-orchestrator-synthesis setup that produced this very decision is the review analog). Same "structure over disposition" root cause as `Q-27`/`Q-28`. Folded into `exploration-mode` (built first, being the cheapest and unblocking proper deliberation).'
folded_into = "exploration-mode"

[[question]]
id = "Q-28"
status = "decided"
ask = "workflow-state navigation/query commands: whether to add targeted read commands (e.g. `agent-scaffold state`, `agent-scaffold next`) that emit a slice of the ledger RESUME STATE, the current step, the open-questions items, and the next required action, for token-efficient resume instead of reading the whole plan and ledger. Trade-off: a token win only where the source grows unbounded or is re-read (the ledger especially), against per-call and per-turn overhead that can exceed a single file read for small files, plus a projection-drift risk (mitigated by the existing structural validator). Decided (human, 2026-07-16, after the two-explorer design pass): build a thin `next` plus a `status --resume` slice (NOT a separate `state` verb, NOT a wholesale navigator), scoped to the resume and CI/check paths only (the honest token win is at cold resume and in a hook, and is negative per-turn during active work, so do not poll it each turn); re-scoped by `round-log-core` (`Q-34`) so it reads the plan parser (`src/plan.rs`) plus the JSONL round log (`src/metrics.rs`) plus a verbatim `## RESUME STATE` section extract, NOT a `ledger-parse` (that step was skipped; there is no `src/ledger.rs`), and reuse `workflow-invariants`' next-action transition logic. `next` doubles as the enforcement aid. Folded into `state-queries`."
folded_into = "state-queries"

