folded_into = "validation-constraints"
receipt = "Q-70"
ask = """how to fix W5's waiver-ownership check, and whether that fix shares a mechanism with the prospective W6 waiver-note join, so the two are designed together rather than one at a time. THE PASS'S MANDATE IS WIDER THAN THAT OPENING QUESTION, and taking the opening question as the scope under-scopes a proposal by more than half. The mandate is the one `Q-55-entryroute` decided: THE W5 FIX PLUS ALL THREE DETECTION MECHANISMS recorded below. That receipt's `chosen` is "Design pass, validator cluster only", and among the three alternatives it was chosen over is "Split out the W5 fix first", so the narrow W5-only reading is precisely the option that was DECLINED. The lettered list in WHAT THE PASS OWES BACK at the end of this item COLLECTS the rulings the pass owes and is the place to read them together; it is not a substitute for the body, which states each duty in the paragraph that raises it and carries the evidence the ruling needs. Read the whole item. THE DESIGN PASS THIS ITEM COMMISSIONED (human-directed, 2026-08-11) HAS RUN AND THE ITEM IS DECIDED: its proposals are in `docs/plans/validation-constraints.explorations/`, and the resolved answer is in the closing paragraph, which supersedes every "not decided" and "no step yet" statement in the body below. THE BODY IS KEPT IN THE TENSE IT WAS WRITTEN IN, as the brief the pass was given: it carried NO options and NO recommendation, deliberately, because it registered the question and the pass's inputs, which is what `status = "exploring"` was for, and it followed the discipline `Q-69` records for its own case.

THE BLOCKER, re-measured against the source rather than relayed. W3 and W5 disagree about what "belongs to a step" means. W3's join PREFERS THE STRUCTURED `step` id a round record carries (`round_step_slug`, `src/workflow.rs:119`), while W5's increment-ownership check is PURELY LEXICAL, `leading_slug(increment) != waiver.step` at `src/workflow.rs:564`, and `leading_slug` (`src/workflow.rs:88`) strips only a `-inc<alnum>` suffix. So a round record whose `task` ends in anything other than `-inc<alnum>` JOINS a step under W3 and CANNOT BE OWNED BY ANY WAIVER UNDER W5. THE AFFECTED POPULATION IS A PROPERTY, NOT A LIST, and NO COUNT OF IT IS STATED HERE, because it grows with the plan: it is every increment identity whose `leading_slug` is not the step it joins under W3, which is every identity no `[[step.waiver]]` can name without W5 refusing it. Reproduce the current set with `jq -r 'select(.type=="round") | [(.step // (.task|sub("-inc[a-zA-Z0-9]+$";""))), (.increment // .task)] | join(" ")' docs/metrics/workflow.jsonl | sort -u | awk '{lead=$2; sub(/-inc[a-zA-Z0-9]+$/,"",lead); if (lead != $1) print $1, $2}'`. TWO MEMBERS OF THAT POPULATION BLOCK A STEP TODAY and are why this item exists: `workflow-enforcement-tier-fold` and `workflow-enforcement-tier-endproperty-fold`, both plan-review loops that closed under human escalation and were never declared. THE POPULATION IS NOT CONFINED TO UNDECLARED FOLD TOKENS, and this is the part a pass must not miss: it already includes ids the plan HAS declared as `[[step.increment]]` entries. The live case is `workflow-driver`, whose declared `workflow-driver-stage0a`, `-stage0b` and `-stage1` carry no `-inc<alnum>` suffix, so `leading_slug` returns each unchanged and none can ever equal the step slug; a `[[step.waiver]]` naming one of the step's own declared increments is refused by W5 while the `src/plan/source.rs` membership check stays silent, because membership holds. THAT IS WHAT KEEPING THE LEXICAL RULE WOULD COST: renaming increment ids the plan has already declared, not merely two orphan fold tokens. W3 skips every step that is not `complete` (`src/workflow.rs:445-447`), so the `workflow-driver` case is latent rather than firing, and the same skip is why the two fold shortfalls were invisible while `workflow-enforcement-tier` was `in-progress`; flipping the status is what exposed them. TWO FACTS THE CODE ITSELF STATES ABOUT THIS AXIS, RECORDED AS MEASURED INPUTS AND NOT AS A RECOMMENDATION, in the same form the item uses for its candidate directions. FIRST, THE CODE CALLS THE LEXICAL STRIP TRANSITIONAL. `leading_slug`'s doc closes at `src/workflow.rs:83-87` with "Inc 2 retires this risk for NEW data: a `round`/`escalation` record may carry a structured `step`/`increment` id, and `round_step_slug`/`escalation_step_slug` (and their increment counterparts) prefer it, so a record with the field joins without ever reaching this lexical strip. This shim remains only for pre-migration records that omit the structured id." SECOND, W5 IS ALREADY MIGRATED ON ITS OTHER AXIS. Inside the same `w5_problems`, the increment-ownership check is lexical at `:564`, while the record-backed evidence check thirty lines later is structured, comparing through `escalation_increment_id` and `escalation_step_slug` at `:594-596` under its own comment at `:590-592`: "Tie the joined escalation to the unit the waiver exempts, preferring the escalation's structured ids (Inc 2) over the `leading_slug`/`task` shim when it carries them." One function, two checks, one migrated and one not. THE LIMIT OF BOTH FACTS, STATED BECAUSE THIS ITEM STATES LIMITS: the retirement sentence is scoped to `round` and `escalation` RECORDS that carry structured ids, and `waiver.increment` is a plan-authored id rather than a `task`, which is the doc's stated subject at `:71`. So the facts bear on the axis without settling it, and nothing here rules which direction follows from them. Measured in `docs/metrics/workflow.jsonl`: each of the two tasks carries FIVE `type:"round"` records; every one of them carries the structured `step` id `workflow-enforcement-tier` and NO structured `increment` id, so each group's identity under W3 is the full `task` (`round_increment_id`, `src/workflow.rs:127`); and the peak `consecutive_clean` is 1 for the plan fold and 0 for the endproperty fold, against the 2 their `risky` class requires.

EVERY ESCAPE ROUTE WAS CHECKED AND NONE EXISTS, recorded here so the pass does not re-derive them; each was re-verified for this registration. (1) A step-unit waiver is consulted ONLY when a step has no round records at all (`src/workflow.rs:450`), and these two have five each. (2) Naming the fold token as the waiver's own `step` is not merely refused by W5's real-Roadmap-step rule (`src/workflow.rs:553`), it is NOT AUTHORABLE AT ALL in the TOML flow: a `[[step.waiver]]` inherits `step` from the `[[step]]` that contains it (`step: step.slug.clone()`, `src/workflow.rs:258`), so the field cannot be set independently. This is one level stronger than the durable record previously stated. (3) `[meta].orphan_tasks` does not participate in W3, or in any workflow check: it occurs nowhere in `src/workflow.rs` and is consumed only by `src/plan/source.rs` for its own duplicate and slug-collision validation. (4) Declaring the fold tokens as `[[step.increment]]` entries does not help, and the reason is STRUCTURAL rather than behavioural, which is stronger than a statement about what W5 chooses to do: `w5_problems` is handed `plan::Step` (`src/plan.rs:55-60`), whose entire content is `slug` and `status`, so there is no declared-increment data in W5's input to consult and no choice being made not to consult it. It derives a slug set from those steps (`src/workflow.rs:549`) because a slug set is all they can yield. This one was MEASURED rather than assumed, and what a declared increment does change is recorded in the next paragraph. (5) The only clean modelling, giving those records no structured `step` id so they never joined at all, would require REWRITING AN APPEND-ONLY LOG.

A SECOND WAIVER-VALIDATION PATH EXISTS, MEASURED AFTER ESCAPE ROUTE 4 WAS WRITTEN AND BEARING DIRECTLY ON IT. `src/plan/source.rs:791-856`, the whole per-step waiver loop, validates waivers per step INDEPENDENTLY of `src/workflow.rs`, and where W5 does a LEXICAL STRIP it does a STRUCTURAL LOOKUP: it builds the step's declared increment set at `src/plan/source.rs:792-793` and checks the waived increment's membership in it at `src/plan/source.rs:807-811`. MEASURED IN SCRATCH RATHER THAN READ. The fixture: copy `docs/` to a temporary directory, inject the owed `workflow-enforcement-tier-w5` waiver under the `workflow-enforcement-tier` step (`unit = "increment"`, `increment = "workflow-enforcement-tier-fold"`, `reason = "accepted-at-escalation"`, `evidence_tier = "record-backed"`, `evidence = "workflow-enforcement-tier-fold"`), then run `validate --workflow` against the copy. UNDECLARED, which is the live shape, BOTH PATHS FIRE, two distinct problems on one waiver at exit 1: "waiver `workflow-enforcement-tier-w5` on step `workflow-enforcement-tier` names increment `workflow-enforcement-tier-fold`, which is not one of the step's increments" from the source path, and "TOML waiver `workflow-enforcement-tier-w5`: increment waiver names step `workflow-enforcement-tier` but increment `workflow-enforcement-tier-fold` belongs to step `workflow-enforcement-tier-fold`" from W5. DECLARED, the same fixture with `workflow-enforcement-tier-fold` added as a `[[step.increment]]`, the `src/plan/source.rs` problem DISAPPEARS and the W5 problem STILL FIRES, again at exit 1. THE CONSEQUENCE: on the declared case THE TWO PATHS RETURN OPPOSITE VERDICTS ON THE SAME WAIVER, so the blocker is DOUBLE-LOCKED while the token is undeclared and becomes ONE REFUSAL PLUS ONE PASS once it is declared. Escape route 4 is therefore CONFIRMED BY MEASUREMENT rather than by reading, declaring the increment still not admitting the waiver; what this item did not previously record is that double lock, and what declaring changes. WHAT THE COMMENT AT `src/plan/source.rs:785-790` COVERS AND DOES NOT COVER, stated as scope and NOT as a verdict: it introduces the block as rules moved from the round log's `check_record` waiver arm and the W5 `reason` to `evidence_tier` pairing, closing "one behaviour, two data representations", and that claim reaches the presence rules and the pairing, both of which genuinely hold, the pairing single-sourced through `WaiverReason::required_tier` and the presence rules re-stated byte-faithfully because they run against typed structs rather than the JSON map `check_record` reads; the membership check at `:807` is NEITHER a presence rule NOR the pairing, and `check_record` could not perform it, having no access to a step's declared increments, so it is a rule the comment's own enumeration does not reach. Whether that is a documentation defect, a deliberate design divergence, or correct as it stands is THE PASS'S RULING TO MAKE and a reviewer's to raise; nothing here calls it either way. THE TWO PATHS ARE NOT SYMMETRIC, AND THE ASYMMETRY IS THE FACT THAT DECIDES WHICH IS AUTHORITATIVE, so it is recorded rather than left for the pass to rediscover. The `src/plan/source.rs` path consults the step's DECLARED increment set structurally (`:792-793`, `:807-811`). W5 consults a SUBSTRING of the increment id and then reports a step that need not exist. MEASURED, in a scratch copy of `docs/` with one `[[step.waiver]]` added under `workflow-enforcement-tier` naming `increment = "totally-not-a-step-inc1"` (`unit = "increment"`, `reason = "review-skipped"`, `evidence_tier = "self-declared"`): at exit 1, W5 reports "increment `totally-not-a-step-inc1` belongs to step `totally-not-a-step`", while the LINE-START ANCHORED control `grep -c '^slug = "totally-not-a-step"$'` over that same plan returns 0. THE UNANCHORED FORM IS NOT THE CONTROL AND MUST NOT BE USED, and this correction is itself the evidence: over this plan it returns a NON-ZERO count whose every hit is this item's own quotation of the probe rather than a Roadmap step, so the unanchored form reports a step that does not exist. That is constraint (3a) below, the self-quoting false green, firing on this item's own strongest evidence, which is why (3a) is stated for any document that quotes its own probes rather than for the ledger alone. The ownership assertion is a substring, not a fact about the plan. AND ON THIS PROJECT'S OWN SUBSTRATE THE STATE W5'S RULE EXISTS TO REPORT CANNOT BE AUTHORED. `[meta].primary = "toml"` (`docs/plans/agent-scaffold.plan.toml:4`); `waivers_from_toml` sets `step: step.slug.clone()` from the containing `[[step]]` (`src/workflow.rs:258`); and the TOML `Waiver` struct (`src/plan/source.rs:279-300`) is `#[serde(deny_unknown_fields)]` with no `step` field at all. W5's own first rule, that a waiver must name a real Roadmap step (`src/workflow.rs:553`), is structurally unreachable on that path for the same reason, because `check_workflow_toml` (`:180-195`) derives both `plan.step_views()` and `waivers_from_toml(plan)` from the same `plan.steps`. The item already carries the authoring half of this as escape route 2, which stays correct as written; what is recorded here is what the same fact implies for THE RULE rather than for a waiver author. WHAT THE PASS OWES ON THIS: a ruling on WHICH PATH IS AUTHORITATIVE for waiver ownership, or whether both should be, because it bears directly on the coupling hypothesis below. A fix that teaches W5 the structural lookup makes the two paths agree; a fix that goes elsewhere leaves the divergence in place. Neither is a local edit, and what each actually costs is priced under THE COUPLING HYPOTHESIS below rather than assumed here.

WHAT IS BLOCKED ON IT. Two waivers are owed and cannot be written, `workflow-enforcement-tier-w5` for the plan fold and `workflow-enforcement-tier-w6` for the `Q-55-endproperty` fold, both `unit = "increment"` under the `workflow-enforcement-tier` step. Their drafted notes are in `docs/plans/agent-scaffold.ledger.md`; find them by the quoted text "TWO WAIVERS ARE OWED AND CANNOT YET BE WRITTEN" rather than by a line number. ONLY THE OWNERSHIP CHECK BLOCKS THEM, which the pass should know because it bounds the fix: each fold token already has a `type:"escalation"` record whose `task` equals it, whose `human_decision` is `decision`, and which carries no structured `increment` id, so W5's record-backed evidence join would resolve through the `task` fallback (`escalation_increment_id`, `src/workflow.rs:141`) and pass. Only after the W5 fix lands does the `workflow-enforcement-tier` step go `complete`.

THE THREE DETECTION MECHANISMS IN THE PASS'S SCOPE, in the buildability order round 3 of inc4 recorded. THAT LABEL IS ACCURATE AND IT IS ONE AXIS ONLY. The order is cheapest-to-dearest to build, and it is NOT a statement about what any of them catches; measured against this repository's own records the yield order runs the other way, and both axes are recorded here so a proposal pricing these mechanisms is not reading a build cost as a priority. YIELD, AS MEASUREMENTS WITH THEIR REPRODUCTIONS AND NO FIGURES CARRIED FORWARD. Mechanism (1) is red on nothing today: every `[[step.waiver]].note` breakdown currently agrees with the `valid_findings` of its increment's round records, so built now it is a regression guard on a convention held correctly by hand. Check it by listing the breakdowns with the grep given below and comparing each against `jq -r --arg t <increment-id> 'select(.type=="round" and ((.increment // .task)==$t)) | .valid_findings' docs/metrics/workflow.jsonl`. Mechanism (2) is red today on the whole unregistered-receipt set, which includes `Q-55-mechanism` and `Q-55-resumecost`, the two receipts whose omission this item's own review loop found; the set difference below reproduces it. Mechanism (3) is the only one of the three that reaches the dangling-quotation class, which is the class no gate in this repository catches. NONE OF THAT RANKS THEM, and letter (f) is still the pass's ruling. THE DATA SURFACES, recorded so that ruling has evidence rather than intuition: mechanism (2)'s inputs are exactly W4's, `w4_problems(questions, decisions, baselines)` fed from `plan.question_views()` and `metrics::parse_decisions` (`src/workflow.rs:218`), and mechanism (3) reads no workflow record at all, so NEITHER touches a waiver, a round record, or the join the pass exists to settle. That is a measured input to letter (f) and NOT an argument that either mechanism is out of scope: both are in the pass's scope by the human's recorded decision, which this item relays and does not reopen. (1) A W6 join checking a waiver note's `<total> (<r1>, <r2>, ...)` per-round breakdown against the `valid_findings` of the round records the same command already reads. The convention already exists, carried in the `note` field of `[[step.waiver]]` entries. THIS IS NOT AN ENFORCEMENT-ONLY GAP, and pricing it as one understates it, which matters because the item requires every proposal to price the mechanism it does not build. MEASURED: the `note` is read by exactly one site in the whole tool, `src/plan/render.rs:527`, which writes it into the generated Markdown, and no check reads it; `Round` (`src/metrics.rs:620-651`) carries `line`, `task`, `artifact`, `outcome`, `consecutive_clean`, `risk_class`, `step` and `increment`, and NOT `valid_findings`, which `parse_rounds` (`src/metrics.rs:660-711`) discards even though `check_record` requires it in the raw record; and `src/workflow.rs` owns no JSON parsing at all, so every check reads rounds through that one projection. The only waiver-to-rounds join anywhere in the tool is W3's covering-waiver match at `src/workflow.rs:498-502`. So building this join needs BOTH the round-log association AND a widening of the projection every check consumes, which is the same projection layer the queued project-identity edit touches under a recorded human constraint. WHETHER THAT MAKES IT COUPLE IS LETTER (a) AND IS THE PASS'S RULING, not this item's. NO COUNT OF THE NOTE SITES IS STATED, for the same reason mechanism (2) states none: the population grows with every escalated loop that earns a waiver, so a figure written here expires. Reproduce the current set with `grep -onE "[(][0-9]+(, [0-9]+){1,6}[)]" docs/plans/agent-scaffold.plan.toml`, and check the convention rather than the number. (2) DANGLING DECISION-RECEIPT DETECTION, stage one being that every `q_id` in a `type:"decision"` record must resolve to a registered `[[question]]` in the plan TOML. NO COUNT IS STATED HERE, DELIBERATELY. The durable record carried "29 of 51", and a first-hand re-measurement for this registration returned a materially different figure, because receipts keep being written; this project's own standing cure, recorded in the ledger against orchestrator defect (12), is that an artifact must not assert a count of something that keeps moving. Re-measure it instead: extract the receipt ids with `jq -r 'select(.type=="decision") | .q_id' docs/metrics/workflow.jsonl | sort -u`, extract the registered question ids from the `[[question]]` blocks of `docs/plans/agent-scaffold.plan.toml`, and take the set difference. The population is dominated by `Q-55-<suffix>` sub-decision ids that were never registered as their own questions, so the pass must rule on whether those are dangling receipts or a legitimate sub-decision convention the check has to model, and that ruling changes what the mechanism is. (3) A QUOTATION RESOLVER, automating what acceptance check 21 already instructs, with the recorded caveat that it would immediately go red on the `src/checks.rs` citations `Q-55-check21b` deliberately left stale. NO COUNT OF THOSE CITATIONS IS STATED, and the recorded "about eleven" is not repeated here, because measurement contradicts it: EVERY distinct `src/checks.rs` citation in `docs/plans/agent-scaffold.steps/checks-runner-worktree-name-collision.md` resolves to unrelated content in the current source, so the resolver's opening red-list is all of them rather than a subset. Enumerate them with `grep -oE "src/checks[.]rs:[0-9]+(-[0-9]+)?" docs/plans/agent-scaffold.steps/checks-runner-worktree-name-collision.md | sort -u`, then open each at the line. `Q-55-check21b`'s ruling that they are deliberately left stale is accurate and stands; only its figure is not repeated. TWO FURTHER DESIGN CONSTRAINTS ON THIS MECHANISM, measured by this loop and recorded because the item's one existing caveat does not reach either. (3a) THE SELF-QUOTING RECORD. A resolver that asks only "does this quoted string occur in the cited file" goes GREEN on the exact class it exists for, as soon as the record writes the defect down: when an edit deleted a sentence this item quoted, the deleted sentence came to occur in the ledger again, inside the post-mortem OF the deletion, so the dangling quotation resolves. Reproduce the shape by grepping the ledger for a sentence a post-mortem quotes and reading where the hit lands. A resolver must therefore scope to LIVE passages and exclude a record's own post-mortems and round records, and this project quotes itself as a matter of practice, so the case is not rare. THE HAZARD IS NOT CONFINED TO THE LEDGER, AND SCOPING IT THERE IS WHAT LET IT BITE THIS ITEM: it reaches ANY document that quotes its own probes, because writing a control command down puts that command's own search string into the document the command searches. The live instance is this item's `totally-not-a-step` control above, whose unanchored form matched the sentence asserting it would not, and the cure is the one this project already applies to ledger handles, a line-start anchored pattern. So a resolver must scope to live passages in EVERY document it reads, and a probe recorded in a document must be written so that the document's own quotation of it cannot match. (3b) EXPECTED TOOL OUTPUT IS NOT A DOCUMENT QUOTATION. The two validator problem strings this item quotes from its own fixture exist, in full, nowhere but this item and its rendered projection, because they are runtime-substituted format output: the format string that produces the first is at `src/plan/source.rs:809`, and the substituted string appears in no source file. A resolver with no expected-output escape therefore reports this item's strongest evidence as dangling. Verify with a fixed-string grep for either quoted problem string across the tree.

THE COUPLING HYPOTHESIS THE PASS MUST SETTLE, and the human's stated ground for running a design pass at all rather than sending a planner straight to the step. W5's ownership check and the prospective W6 join BOTH KEY ON HOW A WAIVER NAMES ITS UNIT, and whether they share a mechanism IS A CLAIM NOBODY HAS MEASURED, which the deciding record attaches to Project Principle 6, "Ground decisions in evidence", as the reason an exploration exists at all. It is not pre-decided here and the pass must rule on it explicitly, because the answer decides the shape of the fix. A THIRD PARTICIPANT IS ALREADY QUEUED TO THE SAME STEP BY RECEIPT, and the item registers it without ruling whether it couples: PROJECT IDENTITY IN THE ROUND RECORD, decided as `Q-55-mechanism` (2026-07-31), whose `chosen` option is "Anchor plus refusal, identity queued" and whose declined wider option was "Anchor, refusal, and identity fields now". What it queued is an optional `project` field on `Round` and on the plan's `[meta]`, filtering the join in `check_workflow_toml`. It is UNBUILT, verified first-hand: `Round` (`src/metrics.rs:620-651`) carries `line`, `task`, `artifact`, `outcome`, `consecutive_clean`, `risk_class`, `step` and `increment`, and no `project`. THE CONSTRAINT THE HUMAN'S RECORDED REASONING ATTACHES, which is why this belongs in front of the pass rather than only in the step: the record schema W3, W4 and W5 all read must take ONE DELIBERATE EDIT RATHER THAN A RIDER ON A PATH FIX. Direction (ii) below reworks that same schema and direction (iii) reads the same `check_workflow_toml` join, so a proposal choosing either is proposing a change the queued edit already has a recorded constraint on. AND THE PROSPECTIVE W6 JOIN NEEDS A SECOND FIELD ON THAT SAME STRUCT, per the pricing recorded under mechanism (1) above: `Round` carries no `valid_findings` and the projection every check reads discards it. So TWO of the three participants this item names for the coupling question edit `Round`, not one, and the recorded constraint reaches both. WHETHER ANY OF IT COUPLES IS THE PASS'S RULING, NOT THIS ITEM'S, and nothing here calls it either way. CANDIDATE DIRECTIONS for the pass to weigh, extend, or discard. NOT a decided option set, NOT exhaustive, and no recommendation attached to any of them. (i) A NARROW LOOKUP of the waived increment against the step's declared `[[step.increment]]` set. WHAT THAT SET ACTUALLY IS, recorded as a measured input and not as a ratio: it is HAND-MAINTAINED IN THE PLAN and is derived from nothing. No code builds it from the round log, so it is not a model of the identities the checks operate on, and the two sets drift independently; `complete` steps exist that declare none at all while their round records carry increment ids; and an increment id may not contain an uppercase byte (`is_kebab_case_token`, `src/plan/source.rs:475-477`, pinned by the test `an_uppercase_increment_id_is_flagged`), so the `-incA` / `-incB` form the round log actually uses, and that `src/workflow.rs:64-68` documents the strip as existing for, CANNOT BE DECLARED AT ALL. Compare the two sets rather than carrying a coverage figure from here: the declared ids are the `[[step.increment]]` entries in `docs/plans/agent-scaffold.plan.toml`, and the identities the checks operate on are `jq -r 'select(.type=="round") | (.increment // .task)' docs/metrics/workflow.jsonl | sort -u`. WHAT THIS DIRECTION COSTS, priced here because the item requires every proposal to price its own: `PlanToml::step_views()` (`src/plan/source.rs:422-430`) drops the increments when it builds the step view W5 receives; `plan::Step` is `Serialize` and is the `status --json` payload (`PlanProjection.steps`, `src/main.rs:582-585`), so widening it changes a machine output contract; the Markdown substrate declares no increments at all (`src/next.rs:520` and `:551`), so this direction owes a ruling on what W5 does there rather than assuming a TOML plan; and `src/next.rs:517-523` records a parity property that deliberately withholds declared-increment data from the projection so both substrates project identically, which this direction pushes the other way. (ii) A REWORK OF HOW A WAIVER NAMES ITS UNIT. This reaches THREE representations, not one: the JSONL `type:"waiver"` arm of `check_record` (`src/metrics.rs:539-601`), the TOML typed struct (`src/plan/source.rs:279-300`), and the `waivers_from_toml` flattening that reconciles them into the shape W3 and W5 consume (`src/workflow.rs:237-267`). The JSONL arm is LIVE and reachable and performs NO ownership check of its own, and under `[meta].primary = "toml"` a JSONL waiver record grants nothing and is reported by nothing, because `check_workflow_toml` reads `waivers_from_toml(plan)` alone. (iii) AN OWNERSHIP RULE STATED AGAINST THE ROUND LOG rather than against the plan, keyed on `round_increment_id` plus the step, exactly as W3's own covering-waiver match already is (`src/workflow.rs:498-502`). It needs no new data source and no type change: `run_checks` (`src/workflow.rs:206-221`) already holds `rounds` and already hands them to `w3_problems`, and simply does not hand them to `w5_problems`. THIS IS RECORDED, NOT RECOMMENDED. It is named because the durable record already states the W5 fix in its terms: the ledger's `validation-constraints` ROUTING PARAGRAPH describes the fix as "teaching W5 the structured step association W3 already uses", which is this direction and neither of the two above. Find that paragraph by its OPENING WORDS, ANCHORED TO THE START OF A LINE: it begins "THE IMMEDIATE NEXT ACTION IS THE `validation-constraints` STEP", so a `grep -n` whose pattern is a caret followed by those opening words lands on it. THE ANCHORING IS THE POINT, and this item asserts no count for the handle: a ledger paragraph is routinely quoted by later paragraphs of the same ledger, so any mid-string handle accumulates hits over time, while a line-start anchor cannot be matched by a quotation embedded inside another paragraph. Do not use the fix quotation above as a handle; it is quoted elsewhere in the ledger. (iv) SCOPE THE OWNERSHIP RULE TO THE SUBSTRATE WHERE ITS PREMISE HOLDS, or retire it in favour of the structural membership check at `src/plan/source.rs:807` that already runs on the TOML path. The premise holds on the JSONL `type:"waiver"` record, whose `step` IS independently authorable; it does not hold on this project's own TOML substrate, per the paragraph above. THIS IS RECORDED, NOT RECOMMENDED, and both sides are priced because the item requires that of every direction. THE BENEFIT, measured first-hand in scratch rather than argued: with the two fold tokens declared as `[[step.increment]]` entries, both owed waivers written and `workflow-enforcement-tier` flipped to `complete`, THE OWNERSHIP RULE IS THE ONLY THING THAT STILL FAILS, every problem the unmodified tool reports being one of its refusals; with that one rule disabled in a scratch build of the same tree, the same fixture returns "workflow invariants hold" at exit 0. So this direction plus the declaration is a COMPLETE unblocking of the two owed waivers, and it touches no shared type, no machine output contract, no second substrate's projection and no waiver schema. THE COST: `run_checks` is deliberately ONE implementation across both substrates (`src/workflow.rs:196-200` states it as Principle 16, one implementation), so a substrate-conditional rule pushes against the same parity property direction (i) already owes a ruling on. Each proposal must state WHICH DIRECTION IT TAKES and WHETHER THAT DIRECTION IS ONE OF THE CANDIDATES NAMED ABOVE OR OUTSIDE THEM, and must say what the other mechanism costs under that choice.

A NAMING COLLISION THE PASS MUST NOT WALK INTO. "W6" ALREADY NAMES TWO DISTINCT UNBUILT CHECKS in the durable record. The first is the waiver-note breakdown join in this item's own scope, above. The second belongs to `Q-59`, whose `ask` records the design pass's fuller option as a "session_state enum + a W6 transition-legality check, no commands"; the human's 2026-07-23 decision then DEFERRED that richer lifecycle state, the transition-legality check included, BEHIND AN EVIDENCE GATE (a first recorded transition failure) rather than dropping it. So the collision does not lapse on its own: it resolves only if one of the two is renumbered before either ships. Measured for this registration: the token `W6` occurs exactly once in `docs/plans/agent-scaffold.plan.toml` outside this item, and that one occurrence is `Q-59`'s. AN ADJACENT CONFUSION IN THIS STEP'S OWN RECORDS, separate and not to be conflated with the above: the two owed waiver ids `workflow-enforcement-tier-w5` and `workflow-enforcement-tier-w6` are NOT check names, they continue the established `-w1` to `-w4` waiver-id sequence this step already carries, so across the W5 check, the two prospective W6 checks and those two waiver ids the tokens `w5` and `w6` now carry three different meanings inside one step's records. THE WAIVER-ID CONVENTION IS ESTABLISHED AND IS NOT THE THING TO CHANGE. The pass must therefore STATE WHICH CHECK IT MEANS wherever it writes "W6", and MAY recommend a renumbering; nothing here pre-decides whether either check is renumbered, or which one.

DEFERRED INPUTS TO THE EVENTUAL STEP, recorded as the members known when this item was written. THIS IS NOT AN INVENTORY AND MAKES NO PRESERVATION PROMISE: the set grows every time a human decision queues work to `validation-constraints`, so a list here cannot be kept complete by any amount of diligence, which is the ruling `Q-55-impactclaim` already made about a list that enumerates its own exclusions. The authoritative set is the ledger's `validation-constraints` routing paragraph, found by its opening words anchored to the start of a line, "THE IMMEDIATE NEXT ACTION IS THE `validation-constraints` STEP", plus every `type:"decision"` receipt in `docs/metrics/workflow.jsonl` whose `chosen` queues work to that step. ENTRIES (a) AND (b) ARE OUT OF THE PASS: they are already-diagnosed point defects with NO OPEN DESIGN SPACE, which is the ground on which `Q-55-entryroute` scoped the pass to the validator cluster only, attached in the record to Project Principle 2, "Minimal by default". THAT CLAUSE SCOPES TO (a) AND (b) ONLY and must not be stretched over the entries after them, which differ: (c) is diagnosed, (d) is inside the pass, and (e) has no owner and no diagnosis. (a) Two pre-existing defects routed from inc3: the plain-`validate` inconsistency where a mode-000 log FILE exits 1 while an unsearchable DIRECTORY exits 0; and a containment TOCTOU where a FIFO-widened mid-run symlink swap yields `workflow invariants hold` at exit 0 over a log OUTSIDE the project root. (b) The `agent-scaffold next` defects routed here by the human decision of 2026-07-30. THE DURABLE RECORD SAYS BOTH THREE AND FOUR, and FOUR is the measured count. NO COUNT OF THE "THREE" PASSAGES IS STATED, and they are not enumerated here, because the ledger is appended to and edited during every loop, so an enumeration written now expires, and this item has already watched the set change under it more than once. State the property instead. The ledger says "three" in several places, one of which is the `Q-55-entryroute` decision record this item cites as its own authority and another of which is the human decision of 2026-07-30 that this same sentence names as the routing authority; it says "four" in the paragraph beginning "A FOURTH `agent-scaffold next` DEFECT", dated 2026-08-01, which states that the fourth "belongs to the validation-constraints step with the other three". EVERY LIVE "THREE" IS OWED A CORRECTION, which is not this item's to make. Find the current set with `grep -niE "three .?(agent-scaffold )?next.? defects" docs/plans/agent-scaffold.ledger.md` rather than trusting any list. The four, described in the paragraph beginning "THREE DEFECTS IN `agent-scaffold next`" and in the FOURTH paragraph above, are: the false completion recommended from a converged last increment while the sidecar commits to unbuilt work; the oversized output from dumping the ledger resume state verbatim; the calm exit with "no plan source" when `--source` is omitted; and the unused `blocked_by` field. Re-measured for this registration: `blocked_by = []` on all 95 steps and zero populated, so the fourth still holds. (c) THE SHARED ROOT CAUSE behind the resume cost, queued by receipt `Q-55-resumecost` (2026-08-02, `chosen` "Accept as (iv), queue the shared cause") as ONE treatment rather than a fresh accepted cost per surface: `src/main.rs:project_root_of_source`'s fallback to the plan's own parent where no `docs/plans`-shaped ancestor exists. Diagnosed, so it sits with (a) and (b) rather than with the pass. Find it by the quoted text "`Q-55-resumecost` DECIDED". (d) PROJECT IDENTITY, queued by receipt `Q-55-mechanism`, is NOT deferred: it is registered above as a candidate participant in the coupling question, because the schema it edits is the schema candidate directions (ii) and (iii) would touch. It is named here only so the two lists do not appear to disagree. (e) THE LEDGER HALF OF THE `run_next` FALSE GREEN, which the record places with NEITHER queued item and states has "NO OWNER anywhere in the plan". It is carried here because an input with no owner is the one most easily lost, and it is NOT diagnosed, so the no-open-design-space clause above does not reach it. Find it by the quoted text "THE BACKSTOP CORRECTED BOTH EARLIER AGENTS ON OWNERSHIP". Find all of these by their quoted text rather than by a line number.

WHAT THE PASS OWES BACK. Explorers write to `docs/plans/validation-constraints.explorations/`, one file each, named `Q-70.md` or `Q-70-<disambiguator>.md` when several run in parallel, per the Design explorations rule in `pack/AGENTS.md`. THIS LETTERED LIST COLLECTS THE RULINGS THE PASS OWES, so they can be read together. IT MAKES NO CLAIM TO EXHAUST THE ITEM, and none should be read into it: each duty is also stated in the body paragraph that raises it, together with the evidence the ruling needs, and this item has gained duties in every round it has been reviewed. Read the whole item; do not work from this list alone. THE LIST IS ALSO ADDITIONAL TO, NOT A REPLACEMENT FOR, what the Design explorations rule cited above requires of every exploration document: the question, the design space of viable options, each option's trade-offs judged against the numbered Project Principles, a recommendation with its reasoning, and an explicit "what not to build" boundary. Read that rule for the current set rather than this restatement of it. Those components are owed whatever this list says; the orchestrator's closing step below synthesises options and reasoning that only they supply. (a) THE COUPLING RULING, which has three parts, all of them explicit rather than implied: whether W5's ownership check and the prospective W6 waiver-note join share a mechanism; whether the project-identity edit queued by `Q-55-mechanism` shares it too, given that it filters the same `check_workflow_toml` join direction (iii) would read and edits the same record schema direction (ii) would rework; and WHAT THE OTHER MECHANISM COSTS under the direction the proposal takes. That last part is the deliverable the decision to run a pass at all was made to obtain: the `Q-55-entryroute` record states the human's ground as the choice "must be made with W6 in view", attaching Project Principle 1, "Prefer the cleaner long-term architecture over the smallest diff". A coupling verdict without the cross-pricing is half the ruling. (b) THE AUTHORITATIVE-PATH RULING: which of W5 (`src/workflow.rs`) and the per-step membership check (`src/plan/source.rs`) owns waiver ownership, or whether both should, given that the two return opposite verdicts on a declared increment AND that they are not symmetric, one consulting the declared set structurally and the other a substring of the id, as the two-path paragraph records. (c) THE DIRECTION AND ITS EDIT SURFACE: which direction the proposal takes, whether that direction is one of the candidates named above or outside them, and which source files it touches, naming in particular any generated const or drift-guarded file. A proposal taking direction (i) also owes a ruling on WHAT W5 DOES ON THE MARKDOWN SUBSTRATE, which declares no increments at all, rather than assuming a TOML plan. Symmetrically, a proposal taking direction (iv) owes a ruling on WHAT W5 DOES ON THE JSONL SUBSTRATE, where the rule's premise does hold and the state it reports can be authored. (d) THE W6 DISAMBIGUATION: which check is meant wherever the proposal writes "W6", given the collision recorded above. (e) THE SUB-DECISION RULING: whether the `Q-55-<suffix>` receipt ids are dangling receipts or a legitimate convention the dangling-receipt detector must model, since that ruling changes what mechanism (2) is. (f) THE SCOPE OF MECHANISMS 2 AND 3: whether the dangling-receipt detector and the quotation resolver are DESIGNED by this pass or only BOUNDED by it. This item has deliberately never said either way, and the pass must state which rather than assume one. (g) THE YAGNI BOUNDARY: an explicit "what not to build". (h) THE COMMENT-COVERAGE RULING: whether the comment at `src/plan/source.rs:785-790` failing to reach the membership check at `:807` is a documentation defect, a deliberate design divergence, or correct as it stands. The item records that divergence above and calls the ruling the pass's own; it is repeated here so a reader of the list does not have to infer it. THE EDIT SURFACE OF THE RULE ITSELF, answered here rather than only demanded, because the item owes of itself what it requires of every proposal: W5's ownership clause is stated verbatim in the pack source `pack/instrument.md:11` and in the two drift-guarded generated files `AGENTS.md:147` and `.agents/AGENTS.reference.md:147` (the guard is `src/agents_md_drift.rs:40-55`), so a change to the rule must move all three together or the test `the_committed_scaffold_matches_a_fresh_render` fails; regeneration is `just scaffold-self`, whose second line runs `nix fmt` over the whole tree. Direction (ii) adds its own: the commented `[[step.waiver]]` example in `pack/plan-template.plan.toml`, and `waiver_note` in `src/plan/render.rs`, which writes each waiver into the generated `<task>.md` and is therefore pinned by `render --check`. The orchestrator then synthesises, moves this item to `open`, and puts the options to the human through the human-input contract.

DECIDED (human, 2026-08-12): DIRECTION (iii), THE ROUND-LOG JOIN, over retiring the ownership rule (direction (iv)) and over building both to compare, with receipt `type:"decision"` `q_id:"Q-70"` in `docs/metrics/workflow.jsonl`. A second decision, receipt `q_id:"Q-70-resolver"`, BOUNDS MECHANISM 3 NOW AND DESIGNS IT LATER, over designing and building it in this step and over dropping it entirely. Folded into `validation-constraints`, whose sidecar carries the fix, the increments and the bounds. `Q-70` is past the `[meta].w4_baseline` cutoff, so W4 enforces the receipt; the `Q-70-resolver` receipt is a sub-decision id under this registered parent and owes no question of its own, per the sub-decision ruling below.

THE PASS'S ANSWER, recorded here so a later reader finds the conclusion without re-reading three explorations. FOUR SITES ANSWER "DOES THIS WAIVER OWN THIS INCREMENT", not the two this item frames the problem around: W3's covering-waiver match, W5's lexical strip, the per-step membership check in `src/plan/source.rs`, and the JSONL `check_record` waiver arm, which performs no ownership check at all. THE CORRECT ANSWER ALREADY EXISTS IN THE TOOL: W3's match at `src/workflow.rs:498-502` already computes the `(step, increment)` relation structurally from the round log, so the fix EXTRACTS AND SHARES that relation rather than inventing or relocating one, and W3 and W5 then consult one implementation. THE COUPLING QUESTION IS ANSWERED AND THE PREMISE INVERTS: whether the W5 fix shares a mechanism with the prospective waiver-note join is a CONSEQUENCE OF THE DIRECTION rather than an empirical unknown, YES under (iii) where both resolve through the same predicate and NO under (i) where they key on different sets; and the recorded schema constraint binds THE OTHER PAIR, because project identity adds `project` to `Round` while the note join needs `valid_findings` on the same `Round`, whereas direction (iii) adds no field to any struct. So `Q-55-mechanism`'s "one deliberate edit rather than a rider on a path fix" binds the note join and project identity and does NOT bind the W5 fix, which ships first and alone. LETTER (e) IS SETTLED ON EVIDENCE ALL THREE EXPLORERS MEASURED INDEPENDENTLY: a receipt `q_id` of the form `Q-<n>-<suffix>` whose parent `Q-<n>` is registered is a LEGITIMATE SUB-DECISION CONVENTION rather than a dangling receipt, so under the parent-resolution reading mechanism (2)'s red list is EMPTY TODAY and it is a REGRESSION GUARD rather than a defect finder. Re-measure that as two properties rather than a set, since the population moves: every unresolved receipt id is `Q-<n>-<suffix>` shaped, and every parent is registered."""

