t 0 at round 4 of a cap of 5, and the human authorised fix the filed findings, state the rule, run one verification round, then merge, with the counters RETIRING rather than resetting because a reset plus one round would end at 1 of 2 and converge nothing. THE VERIFICATION ROUND WAS NOT CLEAN, 3 valid at 2 medium and 1 low plus 1 accepted residual with nothing dismissed, so the authorised path ran out and the artifact went back to the human; `Q-55-verifyclose` then decided apply all three and merge with no further round, and the closing pass authored 19 words against 35 deleted. THE RULE THIS LOOP SHARPENED, which corrects several earlier loops: authored word count is not what re-seeds, since two of the escalation fix's four unpriced sites were ruled true by both lenses while the three that failed shared ONE property, EACH STATING A SCOPE OR OUTCOME MORE GENERALLY THAN WHAT WAS MEASURED, so the operational rule is to state claims in the direction they were measured, in vocabulary the document already defines. Two residuals are carried in the ledger and must not be re-raised without new evidence: `R5A-4`'s orphaned second antecedent, accepted; and the two-surface ledger divergence (`Q-55-ledgerdivergence`), which NO ROUND HAS RULED ON and which whoever reviews inc2's implementation must rule on. Like `workflow-enforcement-tier-w5`, this waiver could not be written until increment 1 of `validation-constraints` replaced W5's lexical ownership strip with a join over the round log."

