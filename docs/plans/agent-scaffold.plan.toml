[[question]]
id = "Q-44"
status = "open"
ask = """the structured-data + human-projection ARCHITECTURE, and the cleanup of accumulated sharp edges: the human decided (2026-07-18, Project Principle 8) that the target architecture is structured, machine-readable formats as the single source for the workflow's data, with `agent-scaffold` projecting them into human-readable views, prioritising best long-term architecture over backwards-compat/blast-radius at this pre-adoption stage. The human ALSO asked to clean up and refine sharp edges in the current design/implementation as part of this, naming the `grandfathered` status as an example. Two coupled questions the human posed: WHAT should be encoded as structured data, and HOW (format + projection). Orchestrator initial framing (to be worked out in a design pass, not decided here): the metrics JSONL is the existing model; the natural structured skeleton is the Roadmap (status + order + dependencies), the Open Questions queue (id/status/ask/options/choice/receipt), decisions/receipts, and cross-references; the hard part is the Step Details reasoning narrative (~80% of the plan), which likely stays PROSE PAYLOADS linked from the structured skeleton (structured frontmatter/records + Markdown bodies) rather than being forced into data fields; `agent-scaffold` renders the structured source -> the human-readable plan/status view (extending the existing `status --json`/`--resume` projection, the prior art). Candidate SHARP EDGES to audit and refine under the architecture-first mandate (initial, non-exhaustive): (1) the `grandfathered` and `trivial` W3-exemption statuses (special-case escape hatches on the Roadmap status enum); (2) the PROLIFERATION of W3 exemption mechanisms, `grandfathered` + `trivial` + the proposed `escalation-exempt` (`Q-40`) would be a THIRD kind of below-bar convergence exemption, which likely should be UNIFIED rather than each a special case (so `escalation-exempt` should be reconsidered as part of this, not built as a one-off); (3) the plan as