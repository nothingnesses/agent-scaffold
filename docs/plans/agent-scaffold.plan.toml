status = "decided"
folded_into = "planner-folds-decisions"
receipt = "Q-67"
ask = """how to fix the actor ambiguity that let the orchestrator start to FOLD a decision itself, given that AGENTS.md names the PLANNER as the decision-folder only on the request-interrupt path (the "non-trivial ... routes to the planner to fold into the plan" line) while the human-input-contract paragraph uses actor-less passive voice ("a resolved decision is recorded ... and folded into the step it affects"), the Socratic-mode paragraph only says the mode "reuses the intake and Open-Questions machinery", and the checkpoint rule ("the orchestrator updates this queue") blurs the boundary that reserves the direct-on-main edits to the orchestrator. DECIDED (human, 2026-07-26): NAME THE PLANNER as the folder of every non-trivial decided decision, at each point of use. Make explicit, at the human-input-contract, Socratic-mode, and checkpoint points in `pack/AGENTS.md`, that folding a non-trivial decided decision into the plan (authoring a `[[question]]` or a `[[step]]`) is the PLANNER's job, routed by the orchestrator; at the checkpoint this reinforces that "the orchestrator updates this queue" means surfacing and pushing the open items, not authoring the decided entries. The exclusion of authoring new questions or steps from the orchestrator's closed list of direct-on-main integration edits (a step's status flip, an increment declaration, a round record, and the ledger's resume anchor) is already carried by the generated `ISOLATION_POLICY_FRAGMENT` (`src/isolation_policy.rs:33`, rendered at `pack/AGENTS.md:91`), whose "author no reviewed product content" rationale reserves those edits to the orchestrator and so already implies authoring reviewed product content is spawned-writer (planner) work; the FIRST pass (step 89) restates none of that list and edits only the three actor-less `pack/AGENTS.md` prose points, the fragment and the completed `driver-output-generation` step 67 (`Q-51`) being its single source; the second pass (step 90, below) holds to the same no-restatement constraint. Rationale: name the actor at the point of use rather than through a cross-reference chain to the request-interrupt path (the AGENTS.md workflow guidance "Make documentation self-contained"; aligned with plan Principle 8 "Structured data first, project for humans" and its one-source-of-truth thinking, keeping ONE authoritative statement of the actor boundary that the other points reinforce), and keep the who-may-edit-what boundary crisp (the AGENTS.md workflow guidance "No silent scope expansion"; plan Principle 1 "Prefer the cleaner long-term architecture over the smallest diff"). Chosen (its receipt bundles both decisions into this one planner pass) over doing Q-66 only and tracking the ambiguity separately (rejected: leaves the live actor-boundary bug unfixed) and over capturing just the diagnosis for now (rejected: the fix is small, and the ambiguity already caused a real misstep). SCOPE OF THE FIRST PASS (step 89, `planner-folds-decisions`, complete): it edited `pack/AGENTS.md` only (guidance, no prompt or source change), then regenerated the deployed `AGENTS.md` and `.agents/AGENTS.reference.md`. SCHEDULING EXTENSION (human, 2026-07-27): step 89 left this decision's currency work unfinished, so the human scheduled the remainder as a SECOND step, `decision-folder-currency` (order 90), covering four further passages, three of them in `pack/prompts/orchestrator.md` (the checkpoint / queue-push, Socratic-mode, and ledger paragraphs) and one in `pack/AGENTS.md` (the ledger paragraph). This decision's edit surface therefore reaches a PROMPT as well as the guidance, and its full regeneration set is `AGENTS.md`, `.agents/AGENTS.reference.md`, and `.agents/prompts/orchestrator.md`; the earlier `pack/AGENTS.md`-only and two-deployed-file statements above describe step 89's pass specifically, not this decision's whole scope. `folded_into` names the first step only, because the schema carries a single slug (`folded_into: Option<String>` in `src/plan/source.rs`); the two-step fan-out is recorded by both steps carrying `decisions = ["Q-67"]` in their `[step.provenance]`. Folded into `planner-folds-decisions` and extended by `decision-folder-currency`; decision receipt `type:"decision"` `q_id:"Q-67"` in `docs/metrics/workflow.jsonl` (Q-67 is past the `Q-44` baseline, so W4 enforces the receipt; the 2026-07-27 extension is a scheduling sub-decision under this same already-decided item, so it adds no question and owes no second receipt). Decision and reasoning in `planner-folds-decisions` and `decision-folder-currency`."""

[[question]]
id = "Q-68"
status = "exploring"
ask = """restructure the review ledger to be STRUCTURED-FIRST, the same "structured data first, project for humans" architecture the plan already has (Principle 8), rather than the current prose-authored `ledger.md` with a secondary `type:"round"` mirror in `docs/metrics/workflow.jsonl`. DIRECTION DECIDED (human, 2026-07-26); the HOW is genuinely open, so a design pass is owed before any build. GOAL: the ledger's round-loop state should live in a structured source that a mechanical check counts from, with the human-readable `ledger.md` round-records narrative PROJECTED from that source, so convergence counting (the `consecutive_clean` streak and the total-round cap) reads structured data instead of an agent parsing prose. MOTIVATIONS: (1) deterministic, auditable convergence counting in place of the current read-the-narrative approach, which has mis-counted historically; (2) eliminate the live DUPLICATION where each round is authored twice, once as prose in `ledger.md` and once as a `type:"round"` record in `docs/metrics/workflow.jsonl`, so the round data has one source rather than two hand-synced homes; (3) architectural consistency with the plan (Principle 8, and its Principle 16-style one-source-of-truth thinking). KEY NUANCE the design MUST respect: the ledger is TWO parts, and this is NOT "structure everything". The round records are structurable (and about 90 percent already exist as the `type:"round"` records in `workflow.jsonl`), but the transient resume-state, the "CURRENT TRANSIENT STATE" / RESUME STATE narrative, is genuinely prose and should STAY a prose component (a sidecar-like part), mirroring the plan's own skeleton-plus-sidecar-plus-projection split rather than forcing the prose into data fields.

OPEN DESIGN QUESTIONS the pass must resolve (none pre-decided): (a) the structured round-record SOURCE, promote or subset the CROSS-TASK, permanent, append-only `workflow.jsonl` as the source, versus a new PER-TASK `<task>.ledger.toml`; this is the crux, because the ledger is per-task and DELETED at task close while `workflow.jsonl` is cross-task and NEVER rewritten, so their lifetimes differ and a single source has to reconcile that mismatch. (b) the projection/`render`-style tool that generates the `ledger.md` round-records narrative view from the structured source (the same class of tool as the plan's `render`). (c) the mechanical convergence counter that reads the structured source and replaces the prose counting (the `consecutive_clean` streak and the total-round cap the orchestrator counts today from the narrative). (d) how the transient resume-state prose is carried as a sidecar-like component alongside the structured round records. (e) MIGRATION of the live ledger plus the doc and prompt currency work the change makes stale (`AGENTS.md`, the role prompts, and `.agents/LEDGER.template.md` with its `pack/LEDGER.template.md` source).

Ground the rationale in plan Principle 8 (Structured data first, project for humans) and its Principle 16-style one-source-of-truth thinking; this is the same class of move as the completed Q-44/Q-45/Q-46 plan-structuring initiative (a structured `<task>.plan.toml` skeleton plus prose sidecars projected to `<task>.md` by `render`), applied to the ledger. A DESIGN PASS IS OWED (human-directed, 2026-07-26); the item points at `docs/plans/structured-ledger.explorations/` for that pass. No receipt and no steps yet; the owed design pass will define the staged build. Do not build until decided."""

[[question]]
id = "Q-69"
status = "exploring"
ask = """who authors an `exploring` Open-Questions item, the orchestrator or the planner. A DESIGN PASS IS OWED (human-directed, 2026-07-28); the item points at `docs/plans/exploring-item-actor-boundary.explorations/` for that pass, and no step exists yet. Do not decide before the pass has run. An earlier draft of this item carried three options and a recommendation, and in each of the two review rounds it existed a fresh reviewer found a valid defect in its PREMISES rather than in its prose, each one invisible to the round before. That is the case `pack/AGENTS.md:45` reserves for an `exploring` item plus explorers rather than for the human-input contract, so the option set is WITHDRAWN, the two unsettled premises are recorded below as the pass's inputs, and the directions are kept as candidates carrying no recommendation.

THE CONTRADICTION (established; raised by the step-90 plan-review triager as finding T-3a, `medium`, valid but out of scope for step 90, and re-reproduced by a later triager's full citation sweep). Read `pack/AGENTS.md:71` whole, because its two halves do not say the same thing. Its MAIN clause is qualified: "Here 'updates this queue' means raising and pushing the open items, not authoring a decided decision's `[[question]]` or `[[step]]` fold, which is the planner's job (routed as above)", and its TRAILING RATIONALE CLAUSE, after the colon, drops that qualifier: "the generated isolation-policy fragment below lists the orchestrator's closed set of direct-on-main edits, which author no reviewed product content, so a `[[question]]` or `[[step]]` (reviewed product content) is not among them". So on the main clause the exclusion reaches only a DECIDED question's fold, while on the trailing clause it reaches a `[[question]]` of any status. Three shipped passages act on the narrower main-clause reading and are therefore in conflict with the trailing one: `pack/AGENTS.md:45` says "the orchestrator records the question as an Open-Questions item with status `exploring`"; `pack/prompts/orchestrator.md:31` third branch says "record it as an `exploring` Open-Questions item"; and `pack/user-prompts/explore.md:13` says "record this as an `exploring` open question" (restated at `:3`), under an instruction to act as the orchestrator (`:7`). An `exploring` item IS a `[[question]]` in the structured source, so the trailing clause forbids what those three prescribe. This is a CONTRADICTION between two halves of one shipped sentence, not the actor-omission class that step 90 fixes, which is why it was split out of that step rather than folded into it.

PREMISE 1 THE PASS MUST SETTLE: is the generated enumeration EXHAUSTIVE or ILLUSTRATIVE? The trailing clause is not a loose restatement of the main one; it is an independent derivation from the generated `ISOLATION_POLICY_FRAGMENT` (`src/isolation_policy.rs`, rendered into the `{{isolation_policy}}` slot at `pack/AGENTS.md:91`), whose closing sentence begins "The only edits made directly on main are" and then names four integration edits. Read the fragment itself for those four; this item deliberately does not reproduce them, because that list is generated and single-sourced and a copy here could drift from it. Verified against the const rather than from memory: it contains no occurrence of the word "question" (a case-insensitive grep of the const returns 0). The unsettled question is what "The only edits ... are" is doing. Under the EXHAUSTIVE reading, recording an `exploring` placeholder is a FIFTH direct-on-main edit, so any direction that lets the orchestrator do it must ALSO amend `src/isolation_policy.rs`, a drift-guarded generated const that ships into every scaffolded project's `AGENTS.md` and `.agents/AGENTS.reference.md`. Under the ILLUSTRATIVE reading, the four items exemplify the "authors no reviewed product content" criterion, that criterion governs, and a direction can argue the placeholder satisfies it without touching the const. THREE CONSEQUENCES the pass must carry, none of them pre-decided here. First, the two readings assign different edit surfaces to directions (i) and (iii) below. Second, under the exhaustive reading, direction (ii) becomes the ONLY one needing no change to a generated source, so the "it widens the shipped edit surface" argument previously deployed AGAINST that direction may run backwards: a Rust const shipping into every scaffolded project is arguably a wider blast radius than one more deployed prose asset. Third, `pack/AGENTS.md:71`'s own "closed set" wording is itself evidence about the intended reading, and if the pass rules ILLUSTRATIVE then that wording becomes something a direction has to fix rather than something it can lean on.

PREMISE 2 THE PASS MUST SETTLE: the boundary of the design space, that is, whether the placeholder has to live in the plan at all. Every direction below takes for granted that it does, and that premise has never been examined. The evidence against relocating it, keeping it ledger-side until it becomes `open`: `exploring` is a typed `QuestionStatus` variant in the structured source (`src/plan/source.rs`), and `pack/AGENTS.md:65` requires that "The Open-Questions item points at the exploration by path while it is `exploring`", so moving the placeholder out of the plan would orphan a schema variant and break the mechanism by which an exploration is referenced. That is a strong reason to hold the boundary where it is, and it is recorded here as evidence rather than as a ruling: it is a schema and entry-mode question adjacent to `Q-68`'s territory, and the pass should state the boundary deliberately instead of inheriting it.

CANDIDATE DIRECTIONS for the pass to weigh, extend, or discard. NOT a decided option set, no recommendation attached, and their costs move with premise 1. (i) NARROW THE TRAILING CLAUSE of `pack/AGENTS.md:71` so its exclusion scopes to a decided question's fold, matching the qualifier the main clause already carries, leaving an undecided placeholder as orchestrator queue management. (ii) ALIGN THE THREE CALL SITES to the trailing clause as written, so the planner authors even a placeholder; this is the direction that needs no reconciliation with the generated fragment under either reading of premise 1, and it would reach a fourth deployed asset, `.agents/user-prompts/explore.md` (`pack/pack.toml:166-167`, `src/manifest.rs:615`). (iii) DERIVE the boundary from the criterion the fragment already states, so that what an edit CONTAINS (reviewed product content or not) decides the actor, rather than the question's status token, which generalises past `exploring` to any future status. Directions (i) and (iii) are related rather than independent: (i) needs a reason the exclusion does not reach a placeholder, and (iii) is the most likely source of that reason, so the pass should consider whether they are one direction stated two ways.

THE ONE OBSERVED INSTANCE, stated once and relied on consistently (an earlier draft over-read it, so the hedging here is deliberate). `Q-68` (`status = "exploring"`) was added as a `[[question]]` directly to `docs/plans/agent-scaffold.plan.toml` on main by commit `b6ba317`, and NO review round exists for it (`grep -c "Q-68" docs/metrics/workflow.jsonl` returns 0). On authorship, the only durable record that speaks to it is the ledger's contemporaneous entry, written three minutes later, which says "NEW BACKLOG (captured 2026-07-26 by a planner, per Q-67)"; find that entry in `docs/plans/agent-scaffold.ledger.md` by its quoted text rather than by a line number. `Q-67` had been live on main for about half an hour by then, so the attribution is chronologically coherent, and this item relies on that record as it stands rather than treating authorship as unknown. On that record, then: a planner authored the placeholder, and no review round was run on it. Nothing is inferred from the commit's shape, which carries no information here, because this repo fast-forwards every converged branch. The pass should treat this as its one data point on what current practice actually costs, and not as a finding of a misstep against any role.

WHAT THE PASS OWES BACK. Explorers write to `docs/plans/exploring-item-actor-boundary.explorations/`, one file each named for the question (`Q-69.md`, or `Q-69-<disambiguator>.md` when several run in parallel), per the Design explorations rule in `pack/AGENTS.md:65`. Each proposal should rule explicitly on premise 1 and on premise 2, state the edit surface its direction implies under that ruling (naming whether `src/isolation_policy.rs` is touched, since that is the difference that moves the comparison), and carry an explicit "what not to build" boundary. The orchestrator then synthesises, moves this item to `open`, and puts the options to the human through the human-input contract.

NOT DECIDED, and NO STEP YET, deliberately. The design pass defines what gets built, and the step is authored afterwards by a planner once the human has decided, with its receipt, which is the same shape `Q-68` uses. An earlier draft of this fold carried a step (`exploring-item-actor-boundary`, order 91) whose sidecar enumerated a different edit set per option; it was removed on 2026-07-28 because its content depended on a decision that has not been made, and its reasoning is preserved in git history for the pass to draw on. No decision receipt is owed while this item is `exploring`; W4 requires one only for a `decided` item past the `[meta].w4_baseline` cutoff."""

[[question]]
