[[question]]
id = "Q-55"
status = "decided"
folded_into = "workflow-enforcement-tier"
receipt = "Q-55"
ask = """the two-tier workflow enforcement gap (SE-3, from the `Q-44` architecture audit `docs/plans/architecture-audit.explorations/audit-sharp-edges.md`): W3 convergence, the metrics validator, and the drift guards only operate when a project opted into `--instrument` and has a JSONL log, so a NON-instrumented project gets NO machine enforcement of any workflow invariant and `validate --workflow` silently passes (a false green); the two-tier split is also undocumented in the scaffolded AGENTS.md, so a user reading the role prompt expects the same guarantees regardless. The audit rated this SIGNIFICANT. How to handle is an open decision; candidate handlings the human should weigh (not pre-decided here): warn on `validate --workflow` when no log exists; require the log unconditionally; or make round-logging core rather than opt-in, which the Principle 8 structured-source direction leans toward. Do not build until decided.

DECISION (human, 2026-07-31): FAIL WHEN `--workflow` CANNOT RUN. `validate --workflow` exits NON-ZERO when the check was explicitly requested and no metrics log exists at the resolved path, reporting why; plain `validate` (and `--source` / `--plan` without `--workflow`) is UNAFFECTED, an absent log there staying a stderr note and exit 0. The reasoning the human accepted: the user explicitly asked for the check, so silently skipping it and reporting success is the defect. Chosen over MAKING ROUND-LOGGING CORE rather than opt-in (rejected as forcing instrumentation on users who did not ask for it, and a substantially bigger change than the defect warrants; Minimal by default) and over WARNING WHILE KEEPING EXIT 0 (rejected because a warning with exit 0 is still green in CI, which is the actual failure mode). The break with today's exit code is authorised by Structured data first, project for humans, whose recorded 2026-07-18 rider makes the best long-term design win over backwards-compatibility at this pre-adoption stage and beat Safe on existing projects where the two conflict; Safe on existing projects is what makes the change `risky`, not what blocks it.

CORRECTION TO THIS ITEM'S OWN WORDING, recorded because the reproduction contradicted it. "Silently passes" above is an OVERSTATEMENT: the skip WAS announced, twice, both in `src/main.rs:run_validate` (the `no metrics log at <path>; nothing to validate` note, and the `--workflow has a plan source but the metrics log is missing; skipping the workflow check` note), and both announcements went to STDERR while stdout carried only the ok summary. The operative defect is the EXIT CODE alone, since a CI gate reads the exit status and not the stderr log. Read this as a false green, never as a silent one.

A SECOND DEFECT, NOT IN THE TEXT ABOVE AND WORSE, found by scaffolding a throwaway non-instrumented project and running the tool against it (2026-07-31). The metrics-log path resolved against the CURRENT WORKING DIRECTORY (`src/main.rs:ValidateArgs::metrics`) rather than against the plan source, so a run made from inside agent-scaffold against a foreign plan joined agent-scaffold's own 235-record log to a one-step foreign plan and reported `workflow invariants hold` at exit 0. Sharpened into a measurable FALSE PASS: give the foreign plan's step a slug that has round records here and mark it `complete`, and this project's rounds satisfy that project's convergence claim. The green is not merely empty, it is affirmatively wrong, and this is a straight bug independent of whichever tier policy was chosen.

SCOPE (human, 2026-07-31, receipt `q_id:"Q-55-scope"`): SAME STEP, SEPARATE INCREMENT. The defects are fixed by ONE step built as separate increments, so the path fix lands and is reviewed independently of the tier-policy change, with the path fix first so the tier change cannot hand users a directory-hopping workaround into the contamination bug. Chosen over giving the path fix its own step ahead of this one and over folding the pair into the validation-constraints step: the defects touch the same code path and produce the same user-facing green, so separate steps would mean reviewing the same region twice. Folded into `workflow-enforcement-tier` (order 94). The decision named TWO increments, which was correct for a step that was then two defects; the count is UNDER-SPECIFIED rather than wrong now that the scope has widened, and the second planner pass re-derived the set as THREE (the resolution rule and all its call sites; the containment refusal; the tier policy plus the documentation half), applying the same division principle rather than appending to the pair. Decision receipts `type:"decision"` `q_id:"Q-55"` and `q_id:"Q-55-scope"` in `docs/metrics/workflow.jsonl`.

TWO SCOPE ADDITIONS, decided by the human after the first fold was authored, both of which that fold had explicitly left open rather than assumed. (1) The DOCUMENTATION half of SE-3 is IN SCOPE: the two-tier split was undocumented in the scaffolded AGENTS.md, so a non-instrumented user read an unconditional promise of the `validate --workflow` backstop (`pack/AGENTS.md:93`) and, after the tier policy landed, would have met a hard failure from a check the guidance still promised them. (2) The SIBLING COMMANDS are IN SCOPE: `status` (`src/main.rs:StatusArgs::metrics`), `next` (`src/main.rs:NextArgs::metrics`) and the derived ledger path (`src/main.rs:default_ledger_path`) carried the identical CWD-relative defect. The fold's stated ground for treating them as separable, that a wrong path there yields an empty projection rather than a false assertion, was FALSIFIED by two explorers independently and re-verified first-hand by the orchestrator on main: `next` emitted `state: converged`, `rounds: 2/5`, `next: mark the step complete, re-render, and commit` at exit 0 for a project with zero rounds of its own, and `status --resume` printed this repository's entire RESUME STATE verbatim into a foreign project's agent brief.

MECHANISM (human, 2026-07-31, receipt `q_id:"Q-55-mechanism"`): ANCHOR PLUS REFUSAL, IDENTITY QUEUED, closing a build-and-measure DESIGN PASS whose three records are at `docs/plans/workflow-enforcement-tier.explorations/`. Ship the metrics path anchored to the plan source PLUS a refusal for unsafe pairings, covering `validate`, `next`, `status` and the ledger path, and QUEUE project identity in the round record to the validation-constraints step. Chosen over pulling the identity fields into the same step and over shipping the anchor alone: the pass measured that anchoring alone leaves the DEFECT CLASS open (its own builder attacked its finished build and produced two further false passes, one via an explicit relative `--metrics` and one via a symlinked source, both printing `workflow invariants hold` at exit 0), so the refusal is not gold-plating; while pulling identity in would edit the record schema W3, W4 and W5 all read, which should be one deliberate edit rather than a rider on a path fix (Minimal by default, against Ground decisions in evidence). The plan-declared log path (`[meta].metrics`) is REJECTED, not deferred: its builder measured that it contributes nothing on shipping day, that a declared path reconstructs the same false pass in a worse form (CWD-independent, committed, and passing `validate --source` clean), that no validator can refuse it because the conventional log lives outside the plan directory so the declared ref must permit the `..` component `is_safe_sidecar_ref` exists to forbid, and that it cannot cover the Markdown `--plan` substrate at all.

HOW THE PROJECTIONS BEHAVE WHEN THE PAIRING IS UNSAFE (human, 2026-07-31, receipt `q_id:"Q-55-refusalscope"`): OMIT THE UNSAFE PART, EXIT 0. The planner raised an ambiguity in the mechanism decision (does the refusal cover `status` and `next`, or only `validate --workflow`) rather than resolving it, and the human chose a THIRD option neither reading contained. `status` and `next` anchor exactly as the validator does; when the pairing is nonetheless unsafe, they OMIT the workflow-derived fields, say why in their place, and EXIT 0. They neither refuse nor project. Chosen over refusal on the validator only (which would have left `next` emitting `state: converged` and `next: mark the step complete` for a project with zero rounds whenever `--metrics` was passed explicitly) and over refusal on all three (which would have broken the projections' documented never-fails contract). THE GROUND, which resolves the contract objection rather than overriding it: `README.md:238` said "Unlike `validate` it never fails on a missing or malformed file (a missing part is simply left out of the projection)", and `run_resume`'s doc comment (`src/main.rs`) matches it, so a log that does not belong to this plan is exactly a part that is not available for this projection and omitting it is the documented contract applied literally. This option therefore needs no authorisation against Safe on existing projects. `next` must emit no ACTION and no `summary` line derived from a log it cannot vouch for, and an unsafe log must NOT be treated as an absent one, since the absent path projects a zero-rounds state and would fabricate `spawn a reviewer for the first review round` instead.

THE MACHINE SURFACE (human, 2026-07-31, receipt `q_id:"Q-55-jsonreason"`): ADD A SERIALISED REASON, so a machine consumer can distinguish an unsafe pairing from an absent log and from an absent plan source. The planner raised this rather than assuming it: `no_active_loop_reason` was `#[serde(skip)]` at `src/next.rs:NextProjection::no_active_loop_reason` and `status`'s projection had no reason field, so the OMIT half of the decision above was met on both surfaces while the SAY WHY half was met only on the human one. Chosen over accepting that `--json` reports only absence and over deferring to the validation-constraints step. The reasoning: `--json` is the surface AGENTS consume, and the omit decision exists precisely because an agent ACTS on `next`'s output, so letting the human renderer explain itself while the machine surface reports a bare `null` inverts the reasoning that produced it. This is a documented-contract change and is handled as one: the field vocabulary is specified in the step file rather than left open (an under-specified vocabulary would reproduce the defect in a new place), four doc comments that claim the JSON contract is exhaustive or enumerate the causes of an absent part are falsified and corrected in the same change, `README.md` and `CHANGELOG.md` carry the addition, and the byte-compare golden at `src/next.rs:tests::GOLDEN_JSON` breaks, which makes the contract change reviewable rather than silent.

THE CONVENTIONLESS-SOURCE CASE (human, 2026-07-31, receipt `q_id:"Q-55-noconvention"`): FALL BACK TO THE SOURCE'S OWN DIRECTORY when the plan source is not under a `docs/plans`-shaped root, with the containment refusal layered on top, over a hard error. The fallback was measured resolving the `--source myplan.plan.toml`-at-a-root case correctly, and Safe on existing projects favours resolving a legitimate layout over rejecting it. TWO ACCEPTED COSTS come with this choice and are NOT oversights to fix: a BARE FILENAME run from inside `docs/plans` remained a silent miss, which no containment guard can catch because containment is not correctness; and a SYMLINKED `docs/plans` directory becomes a FALSE REFUSAL, the canonicalising variant that would fix it having been measured to turn every printed metrics path absolute, changing output on the correct case."""

