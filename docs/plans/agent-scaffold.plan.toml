status = "decided"
ask = "deterministic-checks module config format: how a project declares its checks so `ast-grep` is first-party but other linters/formatters plug in. Decided (human, 2026-07-16, resurfaced post-compaction): option (a), a declarative `.agents/checks.toml` with `[[check]]` entries naming a command, a kind (lint/format), and a format check-mode command, pre-populated with ast-grep + the formatter, users add entries (one source of truth, pluggable, harness-agnostic, no tool dependency). Declined: (b) reuse justfile recipes (depends on `just`, couples to that module) and (c) ast-grep native `sgconfig.yml` + guidance (less pluggable for non-ast-grep tools). Unblocks building increment 2 of `optional-modules`; the settled config layout lives in `optional-modules`. Decision and reasoning fold into `optional-modules`."
folded_into = "optional-modules"

