note = "Five plan-review rounds on this step's own plan fold, three step sidecars plus the plan TOML entries, 41 valid findings as the log records them (15, 11, 8, 7, 0) from ten reviewer passes, two per round on mixed models. THE SEVERITY CEILING FELL MONOTONICALLY AND NEVER ROSE, high, medium, low, low, none, and the peak streak reached 1 of the 2 its risky class needs, reached only by the verification round after the escalation. THE LEDGER'S CALIBRATION SCORECARD STATES 14 AND 10 FOR ROUNDS 1 AND 2, 39 in total, because it excludes accepted residuals; the log's `valid_findings` counts them, so 41 is the figure every check reads and the two are the same loop counted two ways. ESCALATION WAS ARITHMETIC RATHER THAN JUDGEMENT: at round 4 of a cap of 5 with the streak at 0, a perfectly clean round 5 reaches only 1 against a bar of 2, so convergence inside the cap was impossible and spending round 5 would have bought nothing. The human escalated and authorised a specific fix that closes the loop, the seven triaged findings at eleven edit points on ten lines, being 5 deletions, 4 numeral or numeral-qualifier edits, 1 narrowing and 1 clause appended inside an existing sentence, with ZERO new sentences and ZERO new bullets. The counters RETIRE rather than reset, the reset branch having been put and declined because a reset plus the one authorised round would end at 1 of 2 and converge nothing. The fix landed at `61fc8b2`, 3 files and 20 insertions against 20 deletions, all eleven edit points in the prescribed form including the three where the triager had overridden a reviewer, and the verification round was clean from both lenses. NOTHING WAS EVER DISMISSED AT high OR critical, so the backstop never fired on this loop. NO ROUND TOUCHED THE MECHANISM, the three-increment division, the ordering argument or the risk classifications, and every finding from round 3 onward was editorial. THE DIAGNOSED CAUSE OF THE LENGTH is that the document was assembled IN LAYERS across two planner passes, a design pass and four fix passes, so it states the same counts in several places and its characteristic defect is AN AGGREGATE CONTRADICTING A DETAIL ELSEWHERE IN THE SAME DOCUMENT, a class invisible to a reviewer who checks claims against the code. The verification round's consistency lens re-derived 28 counts from scratch, all 28 agreeing, and found that same class once more IN THE REVIEW FILES THEMSELVES, correcting a bookkeeping figure the orchestrator had already relayed to the human. THIS WAIVER POSTDATES ITS LOOP BY ELEVEN DAYS, and the reason is a property of the checker rather than of the review: W5's increment ownership was a lexical strip of a `-inc<alnum>` suffix until increment 1 of `validation-constraints` replaced it with a join over the round log, and this fold's identity is its `task`, which ends in `-fold`, so no waiver could name it however it was written."

