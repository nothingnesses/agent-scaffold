ask = """whether to capture the three mechanisms the `ship-v0-0-2-inc1` review loop measured, before the triage files that hold them are deleted, and what to do with the causation question the 2026-08-13 audit left open. THE OCCASION: five review rounds on `ship-v0-0-2-inc1` produced three measured findings about the review mechanism itself, each sharper than the audit's own account, and one of them CORRECTS the audit's recommendation 3. Their primary sources are the triage files in `docs/plans/agent-scaffold.reviews/`, which this project commit-deletes when a loop closes, so they go when the release lands. OPTIONS PRESENTED: (a) capture the mechanisms now and investigate causation later; (b) capture them and run the causation investigation immediately; (c) neither until the release ships. DECIDED (human, 2026-08-14): (a). Capture is a write against measurements that already exist and it attaches no investigation to this step. Causation is a research question and it carries no deadline. REJECTED (b) because a causation investigation now is a measurement pass about the process, generated by the process, while `v0.0.2` is still unshipped; that is the mechanism the audit measured when it put steps generated by the process itself at 54.2%, and this step's own pointer paragraph exists to avoid restarting it (Principle 2, Minimal by default). REJECTED (c) because the sources are deleted when the loop closes, and the loop closes with the release, so "after the release" is after the evidence has left the tree; recovery from git history stays possible and is not the same thing as holding the measured knowledge in the plan (Principle 6, Ground decisions in evidence). Folded into `workflow-audit-followups`, whose sidecar carries the three mechanisms, their measurements, the per-round re-seeding rates and the commits that hold the sources; decision receipt `type:"decision"` `q_id:"Q-76"` in `docs/metrics/workflow.jsonl`. `Q-76` is past the `[meta].w4_baseline` cutoff, so W4 enforces the receipt.

THE OPEN CAUSATION QUESTION, LEFT FOR LATER AND RECORDED HERE IN FULL BECAUSE THE INVESTIGATION HAS NEVER BEEN RUN AND NOBODY HAS EVER BEEN TASKED WITH IT. The 2026-08-13 audit established WHEN the loop turned and WHAT changed. It did not establish WHY, and nothing since has. Its record dates the transition to "roughly 2026-07-19 through 07-31", states that five auditors working on different questions and without coordinating independently identified the same fortnight, and puts two of its six measures at 07-19 exactly: documentation to code by bytes, 1.28:1 before and 5.17:1 after, and net Rust delivered per week, +3,733 before and +48 after.

THE UNTESTED HYPOTHESIS VISIBLE IN THE DATA is that the `structured-skeleton` plan-as-data migration created a large machine-readable plan surface, which the review loop then began reviewing. Its dates: `Q-45` and `Q-46` decided 2026-07-18, and the six increments built and closed out on 2026-07-19 (`a4d0e0c`). The data in which the hypothesis is visible is the audit's Condition 3: 31% of all findings come from reviewing PLANNING DOCUMENTS, which supply 20 of the project's 32 high-severity findings, and six consecutive late loops covering 154 findings across 22 rounds found ZERO defects in what the software does.

IT IS UNTESTED. Nothing in the audit record tests it, and no measurement anywhere in this repository does. COINCIDENCE AND REVERSE CAUSATION ARE BOTH LIVE, for two reasons. FIRST, the window is the project's largest delivery burst, so a supposed cause and its supposed effect share a stretch that is exceptional for other reasons as well: 2026-07-18 and 07-19 are the project's two highest net `src/*.rs` days, at +3,745 and +5,430 lines, and 2026-07-17 to 07-19 is +10,341 net lines against +3,297 for the three days before it (measured 2026-08-14 with `git log --numstat` over `src/*.rs`). SECOND, the audit's own measure that most directly expresses the hypothesis, steps generated by the process itself rising from 8.3% to 54.2%, is marked MONOTONIC rather than dated, so it does not turn at 07-19 and cannot be used to date a cause there. The reverse direction reads as well against the record as it stands: the loop began reviewing plan documents because delivery had stopped, rather than delivery stopping because the loop began reviewing plan documents.

WHERE THE MATERIAL IS, so the question can be picked up cold. The audit record is `docs/plans/workflow-calibration.explorations/2026-08-13-audit-when-the-loop-turned.md` and its methods companion is `2026-08-13-audit-measurement-methods.md` in the same directory. The four triage files are recoverable at `281f0ad` (round 1), `d7c9fb0` (round 2), `306d13a` (round 3) and `01333f3` (round 4). The three mechanisms are in this step's own sidecar."""

[[question]]
id = "Q-77"
status = "decided"
folded_into = "user-prompts-pointer-and-drift-coverage"
receipt = "Q-77"
ask = """what to do about `audit` naming two unrelated things in one product, now that the rename has shipped and the moment to settle it with the name change has passed. THE COLLISION, measured on the tree at `cd97c7e`: `agent-flow audit` is the subcommand that writes the advisory code-value report (`src/audit.rs`, built by the `code-value-audit-static` step), and `.agents/user-prompts/audit.md` is the human-invoked prompt carrying the pre-registered measurement method (built by `audit-user-prompt`). They share no machinery, no input and no output. One reports which code may be dead; the other runs a controlled empirical study of a claim about the project. A user who reads `agent-flow --help` and then the prompt list has nothing but the word to tell them apart. RAISED BY A REVIEWER during the 0.0.3 release work and out of that review's scope, so nothing has ruled on it and no receipt exists. OPTIONS, NONE PRE-DECIDED, each carrying a cost that has to be priced rather than assumed: (a) rename the subcommand, which is a breaking CLI change in a product that has just spent one on the crate name; (b) rename the prompt, which is a pack asset rename and cheap, though `audit` is the word the method is known by and the prompt is the artifact that teaches it; (c) keep both and disambiguate in the `audit` help text and in the prompt list, which is the cheapest and leaves the collision standing; (d) rule the collision acceptable, on the ground that a subcommand and a pasted prompt are different surfaces and a user never picks between them, and record that ruling so it is not re-raised. THE TIMING FACT THAT BEARS ON IT, recorded because it is the reason this is a question rather than a task: the rename was the one moment when a name change carried no marginal cost to a user, since 0.0.3 already required every invocation to be rewritten, and that moment is gone. From here, option (a) costs a second breaking change and option (b) costs a second pack churn, so the price of (a) and (b) went up on 2026-08-15 while the price of (c) and (d) did not. Do not decide here.

DECIDED (human, 2026-08-15): (c), keep both names and disambiguate them, in the `audit` subcommand's help text and in the shipped prompt list. The "Do not decide here" instruction above bound the pass that raised the question, and this paragraph is the decision it was held for. (c) was also the orchestrator's recommendation. THE RECEIPT'S OPTION ORDER IS NOT THIS ASK'S LETTER ORDER, recorded so the two reconcile without guessing: the receipt presents `Keep both, disambiguate`, `Rule it acceptable, record it`, `Rename the prompt file` and `Rename the subcommand`, which are (c), (d), (b) and (a) here, and its `chosen` value is `Keep both, disambiguate`, so the human chose (c).

THE REASONING THE HUMAN ACCEPTED: the disambiguation rides on an edit this step is already making. Item `A` of `user-prompts-pointer-and-drift-coverage` names `audit.md` in `pack/AGENTS.md` for the first time, so the distinguishing text is a clause inside a sentence that did not exist before, rather than a change to a file this step would otherwise not open (Minimal by default). Its other half is one sentence appended to the doc comment at `src/main.rs:424`, which nothing asserts on: no test in the repository reads any CLI help output, and the step's sidecar carries the grep that measures it.

REJECTED (a), rename the subcommand, because 0.0.3's own CHANGELOG entry instructs every user to rewrite every invocation, including the `command` of a `[[check]]` in `.agents/checks.toml` and any installed `.git/hooks/pre-commit`, and a subcommand rename sends that instruction out a second time within weeks, for a naming nicety rather than for a changed identity.

REJECTED (b), rename the prompt, because `pack/user-prompts/audit.md` shipped in 0.0.3 (`a5bb7ee` is an ancestor of `v0.0.3`), so a rename now churns a pack asset that has been in a published release for exactly one release, and `audit` is the word the measurement method is known by.

REJECTED (d), rule it acceptable and record it, because (c) subsumes it for one clause per site. (d) records the ruling in this queue and leaves `agent-flow --help` and the shipped guidance exactly as they are, so the user who meets the collision still gets nothing from the product; (c) records the ruling here as well, which is what this entry is.

THE PRINCIPLE THAT ARGUES THE OTHER WAY, STATED RATHER THAN OMITTED. Prefer the cleaner long-term architecture over the smallest diff argues for a rename: a name that denotes two unrelated things is a permanent comprehension cost, and a clause in two files documents that cost rather than removing it. It is overridden by the timing fact this ask already records, not by a claim that the collision is harmless. WHAT THAT LEAVES OPEN: this decision does not bar renaming either thing at a future breaking release, and it does not make the collision correct. It closes the question under the plan's ordinary rule, that a folded decision reopens only on evidence that beats its recorded reasoning, and a breaking release is such evidence, because the cost that decided this question is the marginal cost to a user and that cost is different when every invocation is being rewritten anyway.

Folded into `user-prompts-pointer-and-drift-coverage`, whose sidecar carries it as item `C` with both sites, the measurement that nothing pins the help strings, the CHANGELOG consequence and the acceptance criteria; decision receipt `type:"decision"` `q_id:"Q-77"` in `docs/metrics/workflow.jsonl`. Item `C` also carries a separate decision this queue holds no entry of its own for, `Q-77-changelogfix` (human, 2026-08-15), which corrects 0.0.3's false scaffolded-file-layout clause forward under a new `## [Unreleased]` section rather than in place; it follows the `Q-55-<suffix>` sub-decision convention of a receipt without a registered `[[question]]`, so this is the queue's only pointer to it. `Q-77` is past the `[meta].w4_baseline` cutoff of `Q-44`, so W4 enforces the receipt."""

[[question]]
id = "Q-78"
status = "exploring"
receipt = "Q-78"
ask = """how a step records WHAT PROBLEM IT ADDRESSES and HOW IT ADDRESSES IT, and how a reader gets that answer out of the tool rather than out of a file. A DESIGN PASS IS OWED (human-directed, 2026-08-18); the item points at `docs/plans/step-intent-encoding.explorations/` for that pass, and no step exists yet. DO NOT DECIDE BEFORE THE PASS HAS RUN, and do not author an implementation step whose content depends on the outcome; that is the discipline `Q-55-entryroute` set and `Q-69` records for its own case.

THE RECEIPT THIS ITEM ALREADY CARRIES DECIDED THE ROUTE AND NOT THE QUESTION, recorded here so `receipt = "Q-78"` is not misread as decidedness. The `type:"decision"` receipt `q_id:"Q-78"` in `docs/metrics/workflow.jsonl` (human, 2026-08-18) presents "Design pass first", "Structured fields, then a query command" and "Query command only, first", and its `chosen` is "Design pass first". So what is settled is that a design pass runs before any commitment. The item stays `exploring` and carries no `folded_into`, which the schema enforces both ways (`src/plan/source.rs`, the `folded_into` presence rule tied to the `decided` status).

WHAT IS MEASURED TODAY, each fact re-derived rather than carried from the brief that raised this. The measurements are taken on the tree this item is authored into, which is `e8b2992` plus this pass's own two additions, so the step and question counts below read 101 and 78 rather than the 100 and 77 that stand at `e8b2992`.

- THE SCHEMA HAS NO PLACE FOR IT. The `Step` struct (`src/plan/source.rs:129`) carries nine keys: `slug`, `title`, `status`, `order`, `blocked_by`, `folds`, `provenance`, `increment` and `waiver`. None of them states the problem a step addresses or the approach it takes. `provenance` (`Provenance`, `src/plan/source.rs:240`) holds `decisions`, `findings` and `commits`, which is WHY THE STEP EXISTS BY REFERENCE, an adjacent thing rather than a statement of intent: it names the artifacts that justify the step and says nothing about what the step is for.
- THE INTENT LIVES ONLY IN THE SIDECAR, AND ONLY ITS EXISTENCE IS CHECKED. A step's intent is prose in `docs/plans/<task>.steps/<slug>.md`, bound by filename convention at `src/plan/render.rs:180`. `render` is strict about the file BEING THERE (a missing sidecar exits non-zero and writes nothing) and inspects its CONTENT not at all: `step_details_section` (`src/plan/render.rs:573`) inlines the blob verbatim, and its own doc comment records that "each sidecar carries its own `### <slug>` heading". So the binding is checked and the text is not.
- THE PACK ALREADY ASKS FOR THE INTENT AND ALREADY ENFORCES NOTHING, which sharpens the question from "should intent be recorded" to "where should it live and what should check it". The scaffolded step-sidecar template, `pack/plan-template.steps/example-step.md` and its rendered copy `docs/plans/TEMPLATE.steps/example-step.md`, is one heading plus one instruction: "What this step does and how; once done, the outcome and the evidence." That is the problem-and-approach this item is about, already written into every scaffolded project, as a placeholder note a planner deletes. So the convention exists in prose and has no representation in the schema, no check and no query.
- THE SIDECAR ALREADY HAND-DUPLICATES TWO TOML FIELDS WITH NO CROSS-CHECK, which is the existing precedent any answer inherits. Because the heading is the sidecar's own, `slug` and `title` are written twice, once as TOML data and once as prose. Measured over all 101 step sidecars: 90 open with a `###` heading whose first token is the backticked slug, 5 open with a `####` heading of that same form (the sub-steps of an umbrella), 5 open with a `###` umbrella heading that names no slug (`mode-enum`, `pack-manifest`, `convergence-accounting`, `file-safety-rules`, `exploration-mode`), and `core-assets` opens with no heading at all.
- NO SUBCOMMAND ANSWERS THE QUESTION. `agent-flow --help` lists seven: `scaffold`, `validate`, `status`, `next`, `checks`, `render` and `audit`. `status` prints counts and nothing else (`plan: 101 steps (68 complete, 17 deferred, 3 in progress, 6 not started, 3 optional, 4 skipped); 78 open-questions items`). `next` names one step and the role prompt to hand an agent. `render` emits the whole plan document, which is a projection rather than a query. So a human or an agent asking "what is this step for and how does it address it" opens a file.

THE COST OF THE UNCHECKED HALF IS MEASURED RATHER THAN PREDICTED, AND IT IS MORE THAN TEN TIMES THE FIGURE THIS ITEM WAS ROUTED ON. A sweep of every one of the 101 step sidecars against its step's declared `status` finds 21 whose opening status token contradicts it: 10 `complete` steps open "Not started", 7 `complete` steps open "Next", 2 `complete` steps open "Deferred", and 2 of the 3 `in-progress` steps open "Not started". The enumeration, the method, the compatible-pair exemption and the command that reproduces the list are in `sidecar-status-opening-drift`, which fixes them and is itself the 101st step. The human routed this item on 2 observed cases; the population is 21, so the pass must price its options against 21. This is the strongest evidence available on what an unvalidated sidecar convention costs over the plan's 101 steps and the 40 days from the repository's first commit (2026-07-09) to today, and it bears directly on option (a) below, because a schema field is checked by the parser and a paragraph is not.

THE TWO OPTIONS PUT TO THE HUMAN, RECORDED WITH THE COST THAT STOPPED EACH FROM BEING TAKEN ON THE SPOT, so the pass extends the space rather than rediscovering it. (a) STRUCTURED FIELDS, THEN A QUERY COMMAND: add the problem and the approach as fields on `[[step]]`, then a subcommand that projects them. This is the plan's own Principle 8 answer (Structured data first, project for humans) and may well be where the pass lands, and it was rejected AS AN IMMEDIATE COMMITMENT because it touches every step in the plan, needs a backfill, and had not been priced against the alternatives. (b) QUERY COMMAND ONLY, FIRST: a subcommand projecting the existing sidecar prose with no schema change. It is the cheapest and it ships value immediately, and it leaves the intent text unvalidated, so the drift the sweep measured stays possible. NEITHER IS PRE-DECIDED HERE and the pass may reject both.

WHAT THE PASS MUST SETTLE. None of these is pre-decided, and the list is what the pass owes back rather than a substitute for the evidence above.

- (a) THE ENCODING. Required schema fields, optional schema fields, or a validated sidecar contract (a required section, checked by `render` or by `validate --plan`). Required fields make the absence of intent unrepresentable (Make illegal states unrepresentable) and force the backfill; optional fields make partial adoption legal and make "no intent recorded" indistinguishable from "not yet backfilled" unless something else distinguishes them; a validated sidecar contract keeps the prose where it is and checks its shape, which catches an absent section and not a stale one. Say which failures each form actually catches, because the measured drift is a STALE claim rather than an ABSENT one, and a presence check catches only the second.
- (b) THE BACKFILL. 101 steps, of which 68 are `complete`, 17 `deferred`, 6 `not started`, 4 `skipped`, 3 `optional` and 3 `in progress`. Decide whether a `complete` step owes intent at all, whether partial adoption is coherent, and if it is, what makes the un-backfilled steps visible rather than silently empty. The plan already has one declared-exemption pattern to weigh, `[meta].w4_baseline`, which makes the exemption boundary declared data rather than inferred, and one nested-exemption pattern in `[[step.waiver]]`.
- (c) THE QUERY. A new subcommand, or a flag on `status`, or an option on `next`. Decide what it shows for one step and for many, whether it has a `--json` form like its siblings, and what it does for a step whose intent is absent. Note that `status` is documented as "Best-effort; a missing file yields a partial projection" while `render` is strict, so the two established stances differ and the query has to pick one.
- (d) THE INTERACTION WITH THE THREE EXISTING READERS. `render` inlines the sidecar verbatim and would have to decide whether a structured intent field is projected into the Step Detail (a second copy of the same fact) or replaces part of it. `next` builds the brief an agent is handed, so intent is the fact most likely to belong there, and its `context` block is where it would go. `validate --plan` is the only place a content rule could be enforced without changing `render`'s contract.
- (e) THE ASYMMETRY BETWEEN STEPS AND QUESTIONS, WHICH NO OPTION AS PUT ACCOUNTS FOR, AND WHICH IS MEASURED. The plan's two halves answer "where does the prose live" in OPPOSITE ways. All 78 `<task>.questions/<id>.md` sidecars are 0 bytes, and a question's whole body is the TOML `ask` string. Every one of the 101 `<task>.steps/<slug>.md` sidecars carries the body, and the TOML holds no prose for a step beyond `title`. So the project has already run both experiments, and the question half is the one with no drift class of this kind available to it, because there is no second copy to go stale. The pass must either explain why steps and questions should differ or propose unifying them, and it must not adopt an answer for steps that contradicts the shipped answer for questions without saying so.
- (f) WHAT "INTENT" IS, before it is encoded. The brief that raised this names two things, the problem and the approach. A step sidecar in this repo today typically carries more: the measured evidence, the alternatives considered and rejected, the scope boundary, the cost stated so it is weighed, and the executable acceptance criteria. Decide which of those are intent, which are already covered by `provenance`, and which stay prose. Encoding two fields and leaving the rest unstructured is a legitimate answer and it needs stating rather than assuming.
- (g) WHETHER A SIDECAR MAY RESTATE A TOML FIELD AT ALL, WHICH THIS PLAN HAS ALREADY ANSWERED FOR ITSELF AND NO SCAFFOLDED PROJECT INHERITS. `docs/plans/agent-scaffold.documentation-protocol.md:5` ends "The Step Details below carry each step's design, decisions, and (once done) outcome and evidence, and do not repeat the status label", and the ledger records the duplication ruled a valid defect twice, at `:62` (round 2 `G1`, `high`) and at `:101` (round 3 `L1`, left unfixed only because it is plan-wide). `Q-78-statusform` (human, 2026-08-18) acted on that for the 21 mismatching openings, which `sidecar-status-opening-drift` deletes rather than rewrites. THE PASS INHERITS TWO THINGS FROM THAT, neither pre-decided. First, 24 sidecars keep an accurate status label and are outside that step's scope, so the protocol sentence stays false at 24; decide whether they are swept, and by what. Second, `pack/plan-template.documentation-protocol.md` carries NO equivalent sentence, so the rule is local to this plan and no scaffolded project inherits it; decide whether it belongs in the pack, and whether it generalises past `status` to the `slug` and `title` the sidecar heading also duplicates.
- (h) THE `next` OBSERVATION, RECORDED AS EVIDENCE AND RULED A SEPARATE DEFECT. `agent-flow next --source docs/plans/agent-scaffold.plan.toml` reports `workflow-calibration` as the active loop at `awaiting-first-review`, `rounds 0/5`, and offers a reviewer. The arithmetic is correct on its own terms: `select_active_loop` (`src/next.rs:709`) takes the lowest-order `in-progress` step and builds a review loop from it, `workflow-calibration` is order 35 against `workflow-driver` at 52 and `code-value-audit-static` at 86, and no `round` record names it. The step is in an exploration phase, not a review loop. THE VERDICT: this is a defect in `next`, not a part of this question, because it is reachable and fixable with no schema change at all, and it owes its own step and its own human decision. It is recorded here because the pass may find that a step's encoded intent or phase is the clean way to tell an exploration from a review loop, in which case the two answers interact, and because the pass should not assume `next` is a fixed constraint.

THE TWO SUB-DECISIONS THIS QUEUE HOLDS NO ENTRY OF ITS OWN FOR, so this paragraph and item (g) are the queue's only pointers to them. `Q-78-statusdrift` (human, 2026-08-18) decided to correct the stale sidecar openings NOW, as their own step, over folding them into this design pass and over flipping the affected statuses to `not-started` instead. It follows the `Q-55-<suffix>` convention of a receipt without a registered `[[question]]`, so it is cited by receipt (`type:"decision"`, `q_id:"Q-78-statusdrift"`, in `docs/metrics/workflow.jsonl`, added by commit `e8b2992`). Its step is `sidecar-status-opening-drift`, which carries the enumeration and the acceptance criteria and does NOT depend on this pass's outcome: it corrects false statements and settles no rule. `Q-78-statusform` (human, 2026-08-18) then decided that step's FORM: DELETE the token rather than replace it and record the residual, over keeping the label with the protocol sentence recorded as an exclusion, over keeping it and routing the conflict to item (g), and over cutting the step's justification prose down to what the criteria need. It follows the same convention (`type:"decision"`, `q_id:"Q-78-statusform"`, in `docs/metrics/workflow.jsonl`, added by commit `5ca89bb`), and item (g) above records what this pass inherits from it.

Do not build until decided. When the pass has run, the item moves to `open` and the options go to the human under the human-input contract."""

[[principle]]
n = 1
name = "Prefer the cleaner long-term architecture over the smallest diff"
text = "prioritise correctness, internal coherence, and maintainability, and when a local fix conflicts with a cleaner design, choose the cleaner design unless a concrete limitation prevents it."

[[principle]]
n = 2
name = "Minimal by default"
text = "The core does one thing well; everything else is an optional module the user opts into. Adding a module must not complicate the core."

[[principle]]
n = 3
name = "Safe on existing projects"
text = "Scaffolding into a populated repo must never clobber or silently overwrite existing files. Prefer create-if-absent, namespaced locations, and clearly marked idempotent edits."

[[principle]]
n = 4
name = "Idempotent"
text = "Running the tool twice produces the same result as running it once, with no duplicated blocks and no drift."

[[principle]]
n = 5
name = "Make illegal states unrepresentable"
text = "Work out the valid inputs and outcomes first and encode them, rather than admitting bad states and guarding against them at runtime."

[[principle]]
n = 6
name = "Ground decisions in evidence"
text = "Before an approach is built out, validate it with a small proof-of-concept that builds and produces the expected output. If the candidates are exhausted, raise the impasse for a decision rather than forcing through an unvalidated approach."

[[principle]]
n = 7
name = "Reproducible"
text = "Prefer the project's existing toolchain conventions (Nix, just, direnv) so a scaffolded project and its checks behave the same on any machine."

[[principle]]
n = 8
name = "Structured data first, project for humans"
text = "Prefer machine-readable structured formats as the single source for the data the workflow operates on (plan status, the decision queue, decisions/receipts, relationships, metrics), and derive human-readable views by projection, rather than hand-authoring prose that is also the machine input. At this pre-adoption stage, prioritise the best long-term design, architecture, and implementation over backwards-compatibility, API stability, or minimal-diff blast radius; those become constraints once the project has adoption and stability guarantees. Decided by the human 2026-07-18; when this conflicts with Principle 2 (minimal) or Principle 3 (safe on existing projects) at this stage, this wins, and it sharpens Principle 1 (cleaner long-term architecture) and Principle 16-equivalent one-source-of-truth thinking."
