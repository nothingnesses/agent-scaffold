struction); (2) parallel steps (the per-unit-FSM fleet + dependency scheduling above); (3) concrete inputs and outputs (candidate: input = the durable state plus event-recording subcommands like `record-round --outcome clean` that append the log AND advance state atomically, Principle 13; output = a per-unit state summary + valid transitions + the filled next-instruction prompt + Principle reminders, as JSON and human text; keep it STATELESS, recompute from the files each call so it survives crashes/compaction); (4) what is missing. ADDITIONAL CONSIDERATIONS the orchestrator raises for the pass: the tool would become the SOURCE of the workflow LOGIC (convergence/sequencing move from AGENTS.md prose into Rust), the strongest anti-drift property but the biggest cost, and the prose and code could themselves drift unless the AGENTS.md workflow section is GENERATED from the machine definition (the same render closure just built for the plan); ESCAPE HATCHES for exceptions and human overrides are mandatory or the tool becomes a cage; ADOPTION should be EVIDENCE-FIRST (Principle 6), start ADVISORY (the agent drives, the tool suggests, measure whether drift drops) then deepen to authoritative driving, mirroring the receipt/waiver pilots; and this OVERLAPS the queued drift-mitigation cluster (the re-grounding + provenance step and the `Q-50` doc-currency core guidance), so the pass must weigh whether the driver SUBSUMES them. This is a MAJOR initiative, larger than `structured-skeleton`, and genuinely design-open, so it is `exploring`: the human directed (2026-07-19) queueing the exploration FIRST, before folding the Q-50 / re-grounding work it overlaps. A multi-explorer design pass is owed (candidate lenses: a formal-FSM + concurrency model; the tool-vs-prose single-source boundary + AGENTS.md generation; the I/O contract + isolation/harness integration + advisory-first adoption; and a YAGNI/skeptic lens weighing the state-machine driver against the lighter drift mitigations), synthesised, then moved to `open` with options for the human. Design record: `docs/plans/mealy-workflow-driver.explorations/`. DESIGN PASS DONE (2026-07-19): four independent explorers (fsm-concurrency, tool-vs-prose, io-contract-and-adoption, yagni-skeptic) synthesised in `synthesis.md`. STRONG CONVERGENCE: build the ADVISORY MVP first (a read-only, stateless `agent-scaffold next` reusing the W3/W4/W5 reconstruction already shipped, largely the already-planned `state-queries` step plus a next-action reminder), DEFER the full driver (per-unit FSM fleet, `blocked_by` scheduler, event-recording write-path, AGENTS.md-from-machine generation, authoritative driving) behind an EVIDENCE GATE, single-source the convergence CONSTANTS to close the existing `required_streak`/AGENTS.md duplication, and treat the driver as COMPLEMENTING (not subsuming) the re-grounding step and Q-50 (un-gate those; Q-50 is a prerequisite if the driver is built). Options for the human: (A) build the advisory MVP evidence-gated [all four explorers recommend]; (B) build the full driver now [rejected as premature, a subsystem larger than structured-skeleton hardening an evolving workflow]; (C) do not build, rely on the lighter drift mitigations. Orchestrator recommendation: (A). HUMAN DIRECTION (2026-07-19): go with the FULL DRIVER (Option B) as the TARGET, but a DEEPER design pass is owed FIRST, brainstorm the design space, requirements, scope, and possible user flows before committing to a build, so this stays `exploring` (a second design pass owed, not yet decided). Orchestrator note carried into that pass (honouring the skeptic's main objection while enabling the full driver): keep the workflow LOGIC DATA-DRIVEN (a spec the tool interprets, not hardcoded Rust) so the workflow can still evolve without heavy code churn, and STAGE the build (the advisory tier is the natural first increment on the path to the full driver, reusing the W3/`state-queries`/`render` machinery). ROUND 2 exploration qu